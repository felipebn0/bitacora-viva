name: CI

# Corre en cada push y cada Pull Request contra main y pruebas. El repo no
# tenía ningún check automático antes de esto — main solo estaba protegida
# por "requiere PR", sin ningún status check obligatorio, así que un PR
# rompiendo la app se podía mergear igual sin que nada avisara.
#
# NOTA: que este workflow corra no alcanza por sí solo. Para que realmente
# bloquee un merge con errores, hay que ir a GitHub → Settings → Branches →
# reglas de protección de main (y opcionalmente pruebas) y marcar el job
# "build-and-test" de acá abajo como "required status check". Eso es un
# cambio de configuración del repo que tiene que hacer quien administra el
# repositorio — no se puede activar desde un workflow.
# Solo main: los workflows de GitHub Actions pueden leer los secrets del
# repo desde CUALQUIER rama en la que corran, así que dejar que corrieran
# también en `pruebas` (rama a la que un colaborador externo tiene push)
# le daba a esa persona una vía para exfiltrar secrets editando este mismo
# archivo. Los PR que apuntan a main SÍ siguen corriendo CI (el filtro de
# `pull_request` mira la rama DESTINO), vengan de la rama que vengan.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeo de sintaxis
        run: |
          node -c server.js
          node -c api/index.js

      - name: Auditoría de dependencias (falla solo en vulnerabilidades críticas)
        run: npm audit --audit-level=critical

      - name: Tests
        run: npm test

      # Suite aparte (no entra en "npm test") porque necesita el navegador
      # de Playwright instalado — más pesado que los smoke tests normales.
      # Nace de una auditoría de UX que encontró bugs de layout (el nav
      # tapando anclas, el header cortándose con la letra agrandada,
      # botones por debajo del tamaño táctil mínimo) que ningún test
      # anterior agarraba porque ninguno mide nada visual.
      - name: Instalar navegador de Playwright (Chromium)
        # Los espejos de Ubuntu a veces no responden desde GitHub («Temporary
        # failure resolving»): se reintenta y, si no, se instala sin paquetes
        # del sistema (la imagen de ubuntu-latest ya trae casi todos).
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Intento $i falló; reintentando en 20 s…"; sleep 20
          done
          npx playwright install chromium

      # Las 10 suites de Playwright de acá abajo van con "continue-on-error:
      # true" + id: cada una corre pase lo que pase con las anteriores — un
      # fallo en "responsive" ya no deja sin correr a las de después (pasó
      # de verdad: un timing sensible al entorno en "responsive" hizo que
      # pausar/seguir, árbol, mic, a11y, landscape, barra fija y login-vacío
      # ni se ejecutaran en esa corrida). El paso "Resultado de las pruebas
      # de Playwright" de más abajo revisa el resultado de todas y falla el
      # job igual si cualquiera falló — no alcanza con dejarlas correr
      # todas, el check final tiene que seguir bloqueando el merge.
      - name: Pruebas responsive (ancho x escala de letra, Playwright)
        id: responsive
        continue-on-error: true
        run: npm run test:responsive

      # También con Playwright, pero sin server.js: mockea /api/* a nivel
      # de red y sirve public/ solo. Verifica que pausar a mitad de grabar
      # una respuesta guarde lo dicho (en vez de tirarlo a la basura) y que
      # al volver se pida una pregunta nueva, no una repetida.
      - name: Pruebas de pausar/seguir grabando (Playwright)
        id: pause_resume
        continue-on-error: true
        run: npm run test:pause-resume

      # Mi Libro: el respaldo local va por cuenta y un guardado fallido no publica.
      # (Reemplaza la suite vieja del árbol, que buscaba .tree-node: esa vista
      # no existe desde el árbol V4 — el archivo sigue en test/.)
      - name: Pruebas de privacidad y guardado de Mi Libro (Playwright)
        id: libro_privacidad
        continue-on-error: true
        run: npm run test:libro-privacidad

      # Cubre qué pasa si el navegador niega o revoca el permiso de
      # micrófono a mitad de una charla: antes no había ningún test que
      # verificara que app.html avisa con un mensaje claro y ofrece
      # escribir la respuesta, en vez de quedar trabado en "Escuchando…".
      - name: Pruebas de denegación de micrófono (Playwright)
        id: mic_denegado
        continue-on-error: true
        run: npm run test:mic-denegado

      # Scan automático de accesibilidad (axe-core) sobre landing, login y
      # app.html (con el menú de Cuenta abierto). No reemplaza una
      # auditoría manual con lector de pantalla, pero agarra gratis los
      # errores mecánicos más comunes (contraste, labels, landmarks, ARIA).
      - name: Pruebas de accesibilidad (axe-core)
        id: a11y
        continue-on-error: true
        run: npm run test:a11y

      # Vista horizontal (celular girado) y env(safe-area-inset-*) — el
      # segundo simulado vía CDP (Emulation.setSafeAreaInsetsOverride), ya
      # que esos valores no dependen del viewport sino de una barra/notch
      # real del sistema operativo.
      - name: Pruebas de vista horizontal y safe-area (Playwright)
        id: landscape
        continue-on-error: true
        run: npm run test:landscape

      # Con más de una historia a la que se puede colaborar, después de
      # bajar la página no quedaba ningún recordatorio de a quién se le
      # está aportando — la barra de contexto fija (colaborar.html)
      # aparece cuando el header original sale de la vista.
      - name: Pruebas de contexto fijo en colaborar.html (Playwright)
        id: colaborar_sticky
        continue-on-error: true
        run: npm run test:colaborar-sticky

      # Login con campos vacíos: antes tocar "Entrar" sin usuario o sin
      # clave no hacía nada (ni mensaje, ni foco) en app.html y colaborar.html.
      - name: Pruebas de login con campos vacíos (Playwright)
        id: login_vacio
        continue-on-error: true
        run: npm run test:login-vacio

      # Sección "Instalación" en Cuenta (agregar la app a la pantalla de
      # inicio) — 4 escenarios de user agent: iPhone Safari, iPhone Chrome,
      # Android con y sin beforeinstallprompt.
      - name: Pruebas de la sección Instalación en Cuenta (Playwright)
        id: instalacion
        continue-on-error: true
        run: npm run test:instalacion

      # Despedirse con la voz cierra la charla como el botón «Fin», sin
      # falsos positivos. (Reemplaza la suite de .colab-card del árbol viejo.)
      - name: Pruebas de despedida por voz (Playwright)
        id: despedida_voz
        continue-on-error: true
        run: npm run test:despedida-voz

      - name: Resultado de las pruebas de Playwright
        if: always()
        run: |
          fallo=0
          for r in "${{ steps.responsive.outcome }}" "${{ steps.pause_resume.outcome }}" "${{ steps.libro_privacidad.outcome }}" "${{ steps.mic_denegado.outcome }}" "${{ steps.a11y.outcome }}" "${{ steps.landscape.outcome }}" "${{ steps.colaborar_sticky.outcome }}" "${{ steps.login_vacio.outcome }}" "${{ steps.instalacion.outcome }}" "${{ steps.despedida_voz.outcome }}"; do
            if [ "$r" != "success" ]; then fallo=1; fi
          done
          if [ "$fallo" = "1" ]; then
            echo "Al menos una suite de Playwright falló (ver el paso correspondiente más arriba) — corrieron todas igual, pero el job falla."
            exit 1
          fi

      - name: Subir capturas de las pruebas responsive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-responsive
          path: test-artifacts/responsive/
          retention-days: 14
          if-no-files-found: ignore
