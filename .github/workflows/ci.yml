name: CI

# Corre en cada push y cada Pull Request contra main y pruebas. El repo no
# tenía ningún check automático antes de esto — main solo estaba protegida
# por "requiere PR", sin ningún status check obligatorio, así que un PR
# rompiendo la app se podía mergear igual sin que nada avisara.
#
# NOTA: que este workflow corra no alcanza por sí solo. Para que realmente
# bloquee un merge con errores, hay que ir a GitHub → Settings → Branches →
# reglas de protección de main (y opcionalmente pruebas) y marcar el job
# "build-and-test" de acá abajo como "required status check". Eso es un
# cambio de configuración del repo que tiene que hacer quien administra el
# repositorio — no se puede activar desde un workflow.
on:
  push:
    branches: [main, pruebas]
  pull_request:
    branches: [main, pruebas]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeo de sintaxis
        run: |
          node -c server.js
          node -c api/index.js

      - name: Auditoría de dependencias (falla en vulnerabilidades altas/críticas)
        run: npm audit --audit-level=high

      - name: Tests
        run: npm test

      # Suite aparte (no entra en "npm test") porque necesita el navegador
      # de Playwright instalado — más pesado que los smoke tests normales.
      # Nace de una auditoría de UX que encontró bugs de layout (el nav
      # tapando anclas, el header cortándose con la letra agrandada,
      # botones por debajo del tamaño táctil mínimo) que ningún test
      # anterior agarraba porque ninguno mide nada visual.
      - name: Instalar navegador de Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Pruebas responsive (ancho x escala de letra, Playwright)
        run: npm run test:responsive

      # También con Playwright, pero sin server.js: mockea /api/* a nivel
      # de red y sirve public/ solo. Verifica que pausar a mitad de grabar
      # una respuesta guarde lo dicho (en vez de tirarlo a la basura) y que
      # al volver se pida una pregunta nueva, no una repetida.
      - name: Pruebas de pausar/seguir grabando (Playwright)
        run: npm run test:pause-resume

      # También Playwright, sirviendo public/ solo: reproduce el bug
      # reportado (nombres con un acento distinto entre charlas rompían la
      # conexión padre/hijo en el árbol, dejando gente "flotando" en la fila
      # que no era) y confirma que se cierra sin inventar conexiones falsas.
      - name: Pruebas de conexiones del árbol genealógico (Playwright)
        run: npm run test:arbol

      - name: Subir capturas de las pruebas responsive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-responsive
          path: test-artifacts/responsive/
          retention-days: 14
          if-no-files-found: ignore
