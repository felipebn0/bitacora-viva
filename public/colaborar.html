<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aportar — Los recuerdos de mis viejos</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5EFE2;
    --ink: #2B241C;
    --ink-soft: #706551;
    --gold: #93622A;
    --gold-deep: #8F5A20;
    --ring: rgba(201, 138, 60, 0.35);
    --moss: #5B6B45;
    --bubble-user: #EFE6D1;
    --font-display: "Source Serif 4", Georgia, serif;
    --font-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px 60px;
  }
  @media (prefers-reduced-motion: reduce) {
    /* El selector "*" solo no alcanza a la animación del ::before del
       orbe (los pseudo-elementos no quedan incluidos en "*" a secas). */
    *, *::before, *::after { animation-duration: 0.001ms !important; }
  }
  h1 { font-family: var(--font-display); font-size: 1.5rem; margin: 0 0 4px; text-align: center; }
  p.sub { color: var(--ink-soft); font-size: 0.92rem; margin: 0; text-align: center; }

  .login {
    width: min(340px, 100%);
    background: #FBF6EA;
    border-radius: 28px;
    box-shadow: 0 30px 60px -25px rgba(0,0,0,0.35);
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 60px;
  }
  .login input {
    border: 1px solid #E7DFCC; border-radius: 10px; padding: 12px 14px;
    font-family: var(--font-body); font-size: 1rem; background: #fff; color: var(--ink);
  }
  .login button {
    border: none; background: var(--gold-deep); color: #FBF6EA; border-radius: 10px;
    padding: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; font-family: var(--font-body);
  }
  .login button:disabled { opacity: 0.6; cursor: default; }
  .error { color: #a33; font-size: 0.85rem; min-height: 1.2em; text-align: center; }

  #appContent { display: none; flex-direction: column; align-items: center; width: 100%; }
  header { max-width: 440px; width: 100%; text-align: center; margin-bottom: 20px; }
  .owner-name { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; color: var(--gold-deep); margin: 6px 0 2px; }

  .topbar { width: 100%; max-width: 440px; display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 10px; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 50%;
    background: #FBF6EA; border: 1px solid #E7DFCC; font-size: 1.15rem;
    text-decoration: none; cursor: pointer; box-shadow: 0 2px 6px -3px rgba(0,0,0,0.2);
  }

  .collab-switch { width: 100%; max-width: 440px; margin: 0 0 18px; text-align: center; }
  .collab-switch .sub { margin-bottom: 6px; }
  .collab-switch-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .collab-switch-list a {
    display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem;
    text-decoration: none; color: var(--ink); background: #FBF6EA; border: 1px solid #E7DFCC;
  }
  .collab-switch-list a.active { background: var(--gold-deep); color: #FBF6EA; border-color: var(--gold-deep); font-weight: 700; }

  .aportes {
    width: min(440px, 100%);
    margin: 0 auto 20px;
    background: #FBF6EA;
    border: 1px solid #E7DFCC;
    border-radius: 20px;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .aportes h2 { font-family: var(--font-display); font-size: 1.1rem; margin: 0; font-weight: 600; }
  .aportes .sub { color: var(--ink-soft); font-size: 0.9rem; margin: 0; text-align: left; }

  .aporte-chat { display: flex; flex-direction: column; gap: 10px; max-height: 280px; overflow-y: auto; }
  .aporte-bubble { max-width: 92%; font-size: 0.92rem; line-height: 1.4; }
  .aporte-bubble.q { align-self: flex-end; background: var(--bubble-user); padding: 8px 12px; border-radius: 12px; border-bottom-right-radius: 3px; }
  .aporte-bubble.a { align-self: flex-start; color: var(--ink); }
  .aporte-bubble.thinking { align-self: flex-start; color: var(--ink-soft); font-style: italic; }

  .aportes hr { border: none; border-top: 1px solid #E7DFCC; margin: 4px 0; }
  .aportes .msg { font-size: 0.85rem; min-height: 1.2em; color: var(--moss); }
  .aportes .msg.error { color: #a33; }
  .aportes .lista { display: flex; flex-direction: column; gap: 10px; max-height: 220px; overflow-y: auto; }
  .aportes .lista .item { font-size: 0.85rem; color: var(--ink-soft); }
  .aportes .lista .item strong { color: var(--ink); }
  .aportes .lista .item audio { width: 100%; margin-top: 4px; }

  .orb-zone { display: grid; justify-items: center; gap: 10px; padding: 8px 0 4px; }
  .orb-zone .orb {
    width: 128px; height: 128px; border-radius: 50%; border: none; cursor: pointer;
    position: relative; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, var(--gold), var(--gold-deep));
    color: #FBF6EA; font-family: var(--font-body); font-weight: 700; font-size: 0.92rem;
    box-shadow: 0 10px 26px -10px rgba(168,106,38,0.55);
    align-self: center;
  }
  .orb-zone .orb:disabled { opacity: 0.6; cursor: default; }
  .orb-zone .orb::before {
    content: ""; position: absolute; inset: -12px; border-radius: 50%;
    border: 2px solid var(--ring); animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { transform: scale(1); opacity: .6; } 50% { transform: scale(1.08); opacity: .15; } }
  .orb-zone .orb[data-state="listening"] { background: radial-gradient(circle at 35% 30%, #9A6524, var(--gold-deep)); }
  .orb-zone .orb[data-state="listening"]::before { animation-duration: 1.4s; }
  .orb-zone .orb[data-state="thinking"] { background: radial-gradient(circle at 35% 30%, #67774D, var(--moss)); }
  .state-label { font-size: 0.85rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
  .orb-zone .write-toggle {
    background: none; border: none; padding: 0; border-radius: 0;
    color: var(--moss); text-decoration: underline; font-weight: 400;
  }

  .otra-historia-btn {
    border: none; background: var(--moss); color: #FBF6EA; border-radius: 10px;
    padding: 10px 16px; font-weight: 700; cursor: pointer; font-family: var(--font-body);
    align-self: center; display: none;
  }

  .quien-historia { display: flex; flex-direction: column; gap: 8px; }
  .quien-historia-row { display: flex; gap: 18px; }
  .quien-historia-row label { display: flex; align-items: center; gap: 6px; font-size: 0.92rem; cursor: pointer; }
  .quien-historia input[type="text"] {
    border: 1px solid #E7DFCC; border-radius: 10px; padding: 9px 12px;
    font-family: var(--font-body); background: #fff; color: var(--ink); font-size: 0.92rem;
  }

  .logout-row { text-align: center; margin-top: 8px; }
  /* "Borrar mi cuenta" es la única acción irreversible acá — antes se veía
     como un link subrayado más, sin distinguirse de "cerrar sesión". */
  .danger-zone { margin-top: 18px; padding-top: 14px; border-top: 1px solid #E7DFCC; }
  .write-toggle { background: none; border: none; color: var(--moss); text-decoration: underline; cursor: pointer; font-family: var(--font-body); font-size: 0.9rem; }
  .end-toggle { color: #a33; }
  .write-row { display: none; gap: 8px; width: 100%; max-width: 280px; }
  .write-row.visible { display: flex; }
  .write-row input { flex: 1; border: 1px solid #E7DFCC; border-radius: 10px; padding: 9px 12px; font-family: var(--font-body); background: #fff; color: var(--ink); }
  .write-row button { border: none; background: var(--moss); color: #FBF6EA; border-radius: 10px; padding: 0 14px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div class="login" id="loginScreen">
    <h1>Los recuerdos de mis viejos</h1>
    <p class="sub" style="margin-bottom: 6px;">Inicia sesión para aportar historias.</p>
    <input type="text" id="loginUser" placeholder="Correo" autocomplete="username" aria-label="Correo">
    <input type="password" id="loginPass" placeholder="Clave" autocomplete="current-password" aria-label="Clave">
    <button id="loginBtn" type="button">Entrar</button>
    <p class="error" id="loginError"></p>
    <p class="sub" style="margin-top:2px;">¿No tienes cuenta? <a href="/?modo=colaborar#registro" style="color:var(--gold-deep);">Crea una</a>.</p>
  </div>

  <div id="appContent">
    <div class="topbar" id="ownTopbar" style="display:none;">
      <a class="icon-btn" href="/app.html" title="Volver a mi historia" aria-label="Volver a mi historia">↩️</a>
      <a class="icon-btn" href="/arbol.html" title="Mi árbol genealógico" aria-label="Mi árbol genealógico">🌳</a>
      <a class="icon-btn" href="/capitulos.html" title="Mi libro de la historia" aria-label="Mi libro de la historia">📖</a>
    </div>

    <header>
      <h1>Aportar a la bitácora</h1>
      <p class="owner-name" id="ownerName">&nbsp;</p>
      <p class="sub">Cuenta una historia — la entrevistadora te va guiando.</p>
    </header>

    <div class="collab-switch" id="collabSwitch" style="display:none;">
      <p class="sub">Tus colaboraciones:</p>
      <div class="collab-switch-list" id="collabSwitchList"></div>
    </div>

    <div class="aportes">
      <h2>Aportar una historia</h2>

      <div class="quien-historia" id="quienHistoria">
        <p class="sub" style="text-align:left;">¿De quién es esta historia?</p>
        <div class="quien-historia-row">
          <label><input type="radio" name="quienHistoria" value="propia" checked> Mía</label>
          <label><input type="radio" name="quienHistoria" value="otra"> De otra persona</label>
        </div>
        <input type="text" id="protagonistaInput" placeholder="¿De quién es esta historia?" aria-label="¿De quién es esta historia?" style="display:none;">
      </div>

      <div class="aporte-chat" id="aporteChat"></div>

      <div class="orb-zone">
        <button class="orb" id="orb" data-state="idle" type="button" aria-label="Presiona para grabar tu historia">Presiona<br>para hablar</button>
        <div class="state-label" id="recStatus"></div>
        <button class="write-toggle" id="subirAudioBtn" type="button">o sube una nota de voz que ya tengas</button>
        <input type="file" id="subirAudioInput" accept="audio/*" style="display:none;">
        <button class="write-toggle" id="writeToggleColab" type="button">o prefiero escribir mi historia</button>
        <div class="write-row" id="writeRowColab" style="margin: 0 auto;">
          <input type="text" id="writeInputColab" placeholder="Escribí tu historia…" aria-label="Escribir historia">
          <button id="writeSendColab" type="button">Enviar</button>
        </div>
      </div>

      <button class="otra-historia-btn" id="otraHistoriaBtn" type="button">Contar otra historia</button>

      <p class="msg" id="aporteMsg"></p>

      <hr>

      <div class="lista" id="aportesLista"></div>
    </div>

    <div class="logout-row">
      <button class="write-toggle" id="logoutBtn" type="button">cerrar sesión (<span id="whoami"></span>)</button>
      <div class="danger-zone">
        <button class="write-toggle end-toggle" id="deleteAccountToggle" type="button">⚠️ borrar mi cuenta permanentemente</button>
        <div class="write-row" id="deleteAccountRow" style="margin: 10px auto 0;">
          <input type="password" id="deleteAccountPassword" placeholder="Confirma tu clave" autocomplete="current-password" aria-label="Confirma tu clave para borrar la cuenta">
          <button id="deleteAccountConfirm" type="button" style="background:#a33;">borrar</button>
        </div>
        <p class="error" id="deleteAccountError"></p>
      </div>
    </div>
  </div>

<script>
(function () {
  const loginScreen = document.getElementById('loginScreen');
  const appContent = document.getElementById('appContent');
  const loginUser = document.getElementById('loginUser');
  const loginPass = document.getElementById('loginPass');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const logoutBtn = document.getElementById('logoutBtn');
  const whoami = document.getElementById('whoami');
  const ownerName = document.getElementById('ownerName');

  // Si venimos de "colaborar con otra historia" (botón en app.html), la URL
  // trae ?owner=<id> — todas las llamadas a la API de acá en adelante deben
  // avisar para cuál historia son, además de quién está logueado.
  const activeOwnerId = new URLSearchParams(window.location.search).get('owner');
  function conOwner(path) {
    if (!activeOwnerId) return path;
    return path + (path.includes('?') ? '&' : '?') + 'owner=' + encodeURIComponent(activeOwnerId);
  }

  function showApp(data) {
    loginScreen.style.display = 'none';
    appContent.style.display = 'flex';
    whoami.textContent = data.username || '';
    ownerName.textContent = data.ownerName || '';
  }

  function showLogin() {
    appContent.style.display = 'none';
    loginScreen.style.display = 'flex';
    loginPass.value = '';
    loginUser.focus();
  }

  async function doLogin() {
    const username = loginUser.value.trim();
    const password = loginPass.value;
    if (!username || !password) return;
    loginBtn.disabled = true;
    loginError.textContent = '';
    try {
      const resp = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        loginError.textContent = data.error || 'No se pudo iniciar sesión.';
        loginBtn.disabled = false;
        return;
      }
      window.location.reload();
    } catch (e) {
      loginError.textContent = 'Hubo un problema para conectar.';
      loginBtn.disabled = false;
    }
  }

  loginBtn.addEventListener('click', doLogin);
  loginPass.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  loginUser.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginPass.focus(); });

  logoutBtn.addEventListener('click', async () => {
    try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}
    window.location.href = '/';
  });

  // Borrar la cuenta para siempre — para una cuenta colaboradora esto no
  // borra las historias que ya aportó (quedan en la bitácora de la
  // familia), solo el vínculo a su nombre de usuario y la cuenta en sí.
  const deleteAccountToggle = document.getElementById('deleteAccountToggle');
  const deleteAccountRow = document.getElementById('deleteAccountRow');
  const deleteAccountPassword = document.getElementById('deleteAccountPassword');
  const deleteAccountConfirm = document.getElementById('deleteAccountConfirm');
  const deleteAccountError = document.getElementById('deleteAccountError');

  deleteAccountToggle.addEventListener('click', () => {
    deleteAccountRow.classList.toggle('visible');
    deleteAccountError.textContent = '';
    if (deleteAccountRow.classList.contains('visible')) deleteAccountPassword.focus();
  });

  async function borrarCuenta() {
    const password = deleteAccountPassword.value;
    if (!password) return;
    if (!confirm('¿Seguro que quieres borrar tu cuenta para siempre? No se puede deshacer.')) return;
    deleteAccountConfirm.disabled = true;
    deleteAccountError.textContent = '';
    try {
      const resp = await fetch('/api/delete-account', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        deleteAccountError.textContent = data.error || 'No se pudo borrar la cuenta.';
        deleteAccountConfirm.disabled = false;
        return;
      }
      window.location.href = '/';
    } catch (e) {
      deleteAccountError.textContent = 'Hubo un problema para conectar.';
      deleteAccountConfirm.disabled = false;
    }
  }
  deleteAccountConfirm.addEventListener('click', borrarCuenta);
  deleteAccountPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') borrarCuenta(); });

  const ownTopbar = document.getElementById('ownTopbar');
  const collabSwitch = document.getElementById('collabSwitch');
  const collabSwitchList = document.getElementById('collabSwitchList');

  // "Tus colaboraciones": solo las de esta cuenta (el servidor ya filtra
  // por quién está logueado, nunca ve las de otros) — para saltar entre
  // ellas sin volver a pedir el código cada vez.
  async function cargarMisColaboraciones(ownerIdActivo, nombreActivoFallback) {
    try {
      const resp = await fetch('/api/my-collaborations');
      if (!resp.ok) return;
      const data = await resp.json();
      const historias = data.historias || [];
      if (historias.length < 2) return; // con una sola no hace falta el selector
      collabSwitchList.innerHTML = '';
      historias.forEach((h) => {
        const a = document.createElement('a');
        a.href = '/colaborar.html?owner=' + h.ownerId;
        a.textContent = h.ownerName;
        const esActiva = ownerIdActivo
          ? String(h.ownerId) === String(ownerIdActivo)
          : h.ownerName === nombreActivoFallback;
        if (esActiva) a.classList.add('active');
        collabSwitchList.appendChild(a);
      });
      collabSwitch.style.display = 'block';
    } catch (e) {}
  }

  fetch('/api/me')
    .then((resp) => (resp.ok ? resp.json() : Promise.reject()))
    .then(async (data) => {
      // Solo una cuenta que tiene su propia bitácora (no es 100%
      // colaboradora) puede "volver a su historia" — una cuenta 100%
      // colaboradora no tiene árbol, capítulos ni charla propia.
      if (!data.isCollaborator) ownTopbar.style.display = 'flex';

      if (activeOwnerId) {
        // Se llegó acá con un código de otra historia (botón "colaborar con
        // otra historia" en app.html) — puede ser una cuenta dueña normal
        // sumándose a otra bitácora, o una cuenta colaboradora entrando a
        // la suya de siempre. Confirmamos acceso contra el servidor.
        try {
          const resp = await fetch('/api/collaboration-info?owner=' + encodeURIComponent(activeOwnerId));
          if (!resp.ok) { window.location.href = '/app.html'; return; }
          const info = await resp.json();
          showApp({ username: data.username, ownerName: info.ownerName });
          cargarMisColaboraciones(activeOwnerId);
          iniciarAporte();
        } catch (e) {
          window.location.href = '/app.html';
        }
        return;
      }
      // Esta página es solo para cuentas colaboradoras — si es una cuenta
      // dueña normal, la mandamos a la app completa.
      if (!data.isCollaborator) { window.location.href = '/app.html'; return; }
      showApp(data);
      cargarMisColaboraciones(null, data.ownerName);
      iniciarAporte();
    })
    .catch(() => showLogin());

  // --- Aportar una historia: charla turno por turno con la IA ---
  const aporteMsg = document.getElementById('aporteMsg');
  const aportesLista = document.getElementById('aportesLista');
  const aporteChat = document.getElementById('aporteChat');
  const orb = document.getElementById('orb');
  const recStatus = document.getElementById('recStatus');
  const otraHistoriaBtn = document.getElementById('otraHistoriaBtn');
  const writeToggleColab = document.getElementById('writeToggleColab');
  const writeRowColab = document.getElementById('writeRowColab');
  const writeInputColab = document.getElementById('writeInputColab');
  const writeSendColab = document.getElementById('writeSendColab');
  // Si el navegador directamente no puede grabar, el fallback de texto
  // queda siempre visible — "resetChat" (que corre cada vez que arranca
  // una historia nueva) no debe volver a esconderlo en ese caso.
  const micNoDisponible = !window.MediaRecorder || !navigator.mediaDevices;

  let historyLocal = [];
  let audioUrlsLocal = [];
  let charlaTerminada = false;
  let esperandoAclaracion = false; // true justo después de que la IA pidió parentesco/año que faltaban

  // --- ¿De quién es esta historia? ---
  const protagonistaInput = document.getElementById('protagonistaInput');
  const quienRadios = document.querySelectorAll('input[name="quienHistoria"]');
  quienRadios.forEach((r) => {
    r.addEventListener('change', () => {
      const esOtra = document.querySelector('input[name="quienHistoria"]:checked').value === 'otra';
      protagonistaInput.style.display = esOtra ? '' : 'none';
      if (!esOtra) protagonistaInput.value = '';
    });
  });
  function protagonistaActual() {
    const esOtra = document.querySelector('input[name="quienHistoria"]:checked').value === 'otra';
    return esOtra ? protagonistaInput.value.trim() : '';
  }
  function bloquearSelectorProtagonista(bloquear) {
    quienRadios.forEach((r) => { r.disabled = bloquear; });
    protagonistaInput.disabled = bloquear;
  }

  function agregarBurbuja(kind, text) {
    const div = document.createElement('div');
    div.className = 'aporte-bubble ' + kind;
    div.textContent = text;
    aporteChat.appendChild(div);
    aporteChat.scrollTop = aporteChat.scrollHeight;
    return div;
  }

  function resetChat() {
    historyLocal = [];
    audioUrlsLocal = [];
    charlaTerminada = false;
    esperandoAclaracion = false;
    aporteChat.innerHTML = '';
    aporteMsg.textContent = '';
    aporteMsg.classList.remove('error');
    otraHistoriaBtn.style.display = 'none';
    orb.style.display = '';
    document.getElementById('subirAudioBtn').style.display = '';
    writeToggleColab.style.display = '';
    if (!micNoDisponible) writeRowColab.classList.remove('visible');
    writeInputColab.value = '';
    bloquearSelectorProtagonista(false);
    document.querySelector('input[name="quienHistoria"][value="propia"]').checked = true;
    protagonistaInput.style.display = 'none';
    protagonistaInput.value = '';
  }

  async function enviarTurno() {
    const thinking = agregarBurbuja('thinking', 'Pensando…');
    try {
      const resp = await fetch(conOwner('/api/contribute-chat'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history: historyLocal, audioUrls: audioUrlsLocal, protagonista: protagonistaActual() }),
      });
      const data = await resp.json();
      thinking.remove();
      if (!resp.ok) {
        agregarBurbuja('a', data.error || 'No se pudo continuar la charla.');
        return;
      }
      historyLocal.push({ role: 'assistant', content: data.message });
      agregarBurbuja('a', data.message);
      esperandoAclaracion = !!data.needsBasicInfo;
      if (data.done) {
        charlaTerminada = true;
        orb.style.display = 'none';
        document.getElementById('subirAudioBtn').style.display = 'none';
        writeToggleColab.style.display = 'none';
        writeRowColab.classList.remove('visible');
        recStatus.textContent = '';
        aporteMsg.classList.toggle('error', !data.saved);
        aporteMsg.textContent = data.saved ? '✓ Historia guardada. Gracias.' : '⚠️ La charla terminó, pero hubo un problema para guardarla.';
        otraHistoriaBtn.style.display = 'inline-block';
        if (data.saved) { cargarAportes(); }
      }
    } catch (e) {
      thinking.remove();
      agregarBurbuja('a', 'Hubo un problema para conectar.');
    }
  }

  function iniciarAporte() {
    resetChat();
    enviarTurno();
  }

  otraHistoriaBtn.addEventListener('click', iniciarAporte);

  // --- Alternativa por si el micrófono falla o el navegador no graba: se
  // puede escribir la historia en vez de decirla en voz alta (igual que
  // "prefiero escribir" en la charla principal de app.html).
  writeToggleColab.addEventListener('click', () => {
    writeRowColab.classList.toggle('visible');
    if (writeRowColab.classList.contains('visible')) writeInputColab.focus();
  });

  async function enviarTextoEscrito() {
    const texto = writeInputColab.value.trim();
    if (!texto || charlaTerminada) return;
    bloquearSelectorProtagonista(true);
    writeInputColab.value = '';
    writeRowColab.classList.remove('visible');
    historyLocal.push({ role: 'user', content: texto });
    agregarBurbuja('q', texto);
    await enviarTurno();
  }
  writeSendColab.addEventListener('click', enviarTextoEscrito);
  writeInputColab.addEventListener('keydown', (e) => { if (e.key === 'Enter') enviarTextoEscrito(); });

  // --- Grabar la historia con la voz ---
  let mediaStream = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let grabando = false;

  // Igual que en la charla principal: no hace falta presionar de nuevo
  // para "cortar" — mientras haya voz seguimos grabando, y recién cuando
  // pasan unos segundos de silencio se corta y se manda solo.
  const SILENCE_MS = 2000;
  const VAD_THRESHOLD = 0.02;
  let audioContext = null;
  let analyser = null;
  let vadRafId = null;
  let vadActive = false;
  let lastLoudTime = 0;

  function startVAD() {
    if (!mediaStream) return;
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === 'suspended') audioContext.resume();
    const source = audioContext.createMediaStreamSource(mediaStream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);

    const data = new Uint8Array(analyser.frequencyBinCount);
    lastLoudTime = Date.now();
    vadActive = true;

    function tick() {
      if (!vadActive) return;
      analyser.getByteTimeDomainData(data);
      let sumSquares = 0;
      for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sumSquares += v * v;
      }
      const rms = Math.sqrt(sumSquares / data.length);
      if (rms > VAD_THRESHOLD) lastLoudTime = Date.now();
      if (Date.now() - lastLoudTime > SILENCE_MS) {
        stopVAD();
        terminarGrabacion();
        return;
      }
      vadRafId = requestAnimationFrame(tick);
    }
    tick();
  }

  function stopVAD() {
    vadActive = false;
    if (vadRafId) cancelAnimationFrame(vadRafId);
    vadRafId = null;
  }

  async function empezarGrabacion() {
    if (charlaTerminada || grabando) return;
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      recStatus.textContent = 'No se pudo acceder al micrófono — puedes escribir tu historia en su lugar.';
      writeRowColab.classList.add('visible');
      writeInputColab.focus();
      return;
    }
    audioChunks = [];
    try {
      mediaRecorder = new MediaRecorder(mediaStream, { audioBitsPerSecond: 40000 });
    } catch (e) {
      mediaRecorder = new MediaRecorder(mediaStream);
    }
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.start();
    grabando = true;
    orb.dataset.state = 'listening';
    orb.innerHTML = 'Te<br>escucho…';
    orb.setAttribute('aria-label', 'Grabando tu historia — presiona para cortar');
    recStatus.textContent = '⏺️ Grabando… se corta sola cuando hagas una pausa.';
    subirAudioBtn.disabled = true;
    startVAD();
  }

  function detenerGrabacionRaw() {
    return new Promise((resolve) => {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') { resolve(null); return; }
      mediaRecorder.onstop = () => resolve(new Blob(audioChunks, { type: 'audio/webm' }));
      mediaRecorder.stop();
    });
  }

  // Sube el audio, lo transcribe, y manda ese texto como el siguiente turno
  // de la charla — se usa tanto para lo grabado en vivo como para un
  // archivo de audio ya existente que suban. Si este turno es solo la
  // respuesta a una aclaración de parentesco/año que faltaba, ese audio
  // corto NO se guarda — solo se transcribe para seguir la charla.
  async function procesarAudio(blob, contentType) {
    // Ya arrancó a contar — no tiene sentido cambiar de quién es la
    // historia a mitad de camino.
    bloquearSelectorProtagonista(true);

    const esSoloAclaracion = esperandoAclaracion;

    if (!esSoloAclaracion) {
      try {
        const upResp = await fetch(conOwner('/api/contribute-audio'), {
          method: 'POST',
          headers: { 'Content-Type': contentType },
          body: blob,
        });
        if (upResp.ok) {
          const upData = await upResp.json();
          if (upData.url) audioUrlsLocal.push(upData.url);
        }
      } catch (e) {}
    }

    let texto = '';
    try {
      const trResp = await fetch('/api/transcribe', {
        method: 'POST',
        headers: { 'Content-Type': contentType },
        body: blob,
      });
      if (trResp.ok) {
        const trData = await trResp.json();
        texto = (trData.text || '').trim();
      }
    } catch (e) {}

    if (!texto) return false;
    historyLocal.push({ role: 'user', content: texto });
    agregarBurbuja('q', texto);
    await enviarTurno();
    return true;
  }

  async function terminarGrabacion() {
    if (!grabando) return;
    stopVAD();
    grabando = false;
    orb.dataset.state = 'thinking';
    orb.innerHTML = 'Un<br>momento…';
    orb.setAttribute('aria-label', 'Procesando tu historia');
    orb.disabled = true;
    recStatus.textContent = 'Procesando el audio…';

    const blob = await detenerGrabacionRaw();
    if (mediaStream) { mediaStream.getTracks().forEach((t) => t.stop()); mediaStream = null; }

    const reset = () => {
      orb.dataset.state = 'idle';
      orb.innerHTML = 'Presiona<br>para hablar';
      orb.setAttribute('aria-label', 'Presiona para grabar tu historia');
      orb.disabled = false;
      subirAudioBtn.disabled = false;
    };

    if (!blob || !blob.size) {
      recStatus.textContent = '';
      reset();
      return;
    }

    const ok = await procesarAudio(blob, 'audio/webm');
    recStatus.textContent = ok ? '' : 'No se pudo entender el audio. Intenta de nuevo.';
    reset();
  }

  orb.addEventListener('click', () => {
    if (grabando) { terminarGrabacion(); return; }
    empezarGrabacion();
  });

  if (micNoDisponible) {
    orb.disabled = true;
    orb.title = 'Este navegador no permite grabar audio.';
    recStatus.textContent = 'Este navegador no permite grabar audio — puedes escribir tu historia en su lugar.';
    writeRowColab.classList.add('visible');
  }

  // --- Subir una nota de voz que ya tengas guardada ---
  const subirAudioBtn = document.getElementById('subirAudioBtn');
  const subirAudioInput = document.getElementById('subirAudioInput');
  const MAX_AUDIO_FILE_BYTES = 4 * 1024 * 1024; // Vercel corta pedidos de más de ~4.5MB

  subirAudioBtn.addEventListener('click', () => { if (!charlaTerminada) subirAudioInput.click(); });

  subirAudioInput.addEventListener('change', async () => {
    const file = subirAudioInput.files[0];
    subirAudioInput.value = '';
    if (!file) return;
    if (file.size > MAX_AUDIO_FILE_BYTES) {
      recStatus.textContent = 'El archivo pesa más de 4MB — prueba con uno más corto por ahora.';
      return;
    }
    subirAudioBtn.disabled = true;
    orb.disabled = true;
    recStatus.textContent = 'Procesando el audio…';
    const ok = await procesarAudio(file, file.type || 'audio/mp4');
    recStatus.textContent = ok ? '' : 'No se pudo entender el audio. Intenta de nuevo.';
    subirAudioBtn.disabled = false;
    orb.disabled = false;
  });

  async function cargarAportes() {
    try {
      const resp = await fetch(conOwner('/api/contributions'));
      if (!resp.ok) return;
      const data = await resp.json();
      aportesLista.innerHTML = '';
      const items = (data.notes || []).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      items.forEach((it) => {
        const div = document.createElement('div');
        div.className = 'item';
        // contributor/parentesco/protagonista/texto son texto libre que
        // cualquier colaborador puede mandar — se arma el DOM a mano
        // (textContent) en vez de pegarlo como HTML, para que no se pueda
        // inyectar código a través de un aporte.
        const urls = (it.audio_urls && it.audio_urls.length) ? it.audio_urls : (it.audio_url ? [it.audio_url] : []);
        const quien = it.contributor ? it.contributor + (it.parentesco ? ` (${it.parentesco})` : '') : 'Familia';
        const etiqueta = it.protagonista ? `Historia de ${it.protagonista} — compartida por ${quien}` : quien;
        const strong = document.createElement('strong');
        strong.textContent = etiqueta + ':';
        div.appendChild(strong);
        div.appendChild(document.createTextNode(' ' + it.texto));
        urls.forEach((u) => {
          if (typeof u === 'string' && /^https?:\/\//.test(u)) {
            const audio = document.createElement('audio');
            audio.controls = true;
            audio.src = u;
            div.appendChild(audio);
          }
        });
        aportesLista.appendChild(div);
      });
    } catch (e) {}
  }

  cargarAportes();
})();
</script>
</body>
</html>
