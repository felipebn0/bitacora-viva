<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro de la historia — Los recuerdos de mis viejos</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5EFE2;
    --ink: #2B241C;
    --ink-soft: #8A7C63;
    --gold-deep: #A86A26;
    --bubble-user: #EFE6D1;
    --font-display: "Source Serif 4", Georgia, serif;
    --font-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding: 28px 20px 60px;
  }
  header { max-width: 720px; margin: 0 auto 20px; display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  h1 { font-family: var(--font-display); font-size: 1.6rem; margin: 0; }
  header p { color: var(--ink-soft); margin: 4px 0 0; font-size: 0.95rem; }
  a.volver { color: var(--gold-deep); font-size: 0.9rem; text-decoration: none; border-bottom: 1px solid var(--gold-deep); }

  .wrap { max-width: 720px; margin: 0 auto; }

  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  button.generar {
    border: none; background: var(--gold-deep); color: #FBF6EA; border-radius: 10px;
    padding: 12px 20px; font-weight: 700; font-size: 0.95rem; cursor: pointer; font-family: var(--font-body);
  }
  button.generar:disabled { opacity: 0.6; cursor: default; }
  .status { color: var(--ink-soft); font-size: 0.9rem; }

  .empty { color: var(--ink-soft); font-style: italic; margin-top: 40px; }

  .chapter {
    background: #FBF6EA;
    border: 1px solid #E7DFCC;
    border-radius: 18px;
    padding: 22px 26px;
    margin-bottom: 20px;
  }
  .chapter .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .chapter .theme { color: var(--gold-deep); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; margin: 0 0 4px; }
  .chapter h2 { font-family: var(--font-display); font-size: 1.3rem; margin: 0 0 12px; }
  .chapter .text { white-space: pre-wrap; line-height: 1.6; font-size: 0.98rem; }
  .chapter .meta { color: var(--ink-soft); font-size: 0.78rem; margin-top: 14px; }
  .chapter .borrar {
    border: none; background: none; color: var(--ink-soft); cursor: pointer;
    font-size: 0.78rem; text-decoration: underline; font-family: var(--font-body); padding: 0; flex-shrink: 0;
  }
  .chapter .borrar:hover { color: #a33; }

  .aportes-section { margin-bottom: 40px; }
  .aportes-section h2 { font-family: var(--font-display); font-size: 1.2rem; margin: 0 0 4px; }
  .aportes-section .sub { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 16px; }
  .aporte-item {
    background: #FBF6EA; border: 1px solid #E7DFCC; border-radius: 14px;
    padding: 14px 18px; margin-bottom: 12px; font-size: 0.92rem;
  }
  .aporte-item .quien { color: var(--gold-deep); font-weight: 700; font-size: 0.82rem; margin: 0 0 4px; }
  .aporte-item .texto { line-height: 1.5; }
  .aporte-item audio { width: 100%; margin-top: 8px; }
  .aporte-item .editar-btn {
    background: none; border: none; color: var(--ink-soft); text-decoration: underline;
    cursor: pointer; font-family: var(--font-body); font-size: 0.78rem; padding: 0; margin-top: 8px;
  }
  .aporte-item textarea {
    width: 100%; border: 1px solid #E7DFCC; border-radius: 10px; padding: 8px 10px;
    font-family: var(--font-body); font-size: 0.9rem; margin-top: 6px; resize: vertical; min-height: 70px;
  }
  .aporte-item .editar-row { display: flex; gap: 8px; margin-top: 6px; }
  .aporte-item .editar-row button {
    border: none; border-radius: 8px; padding: 5px 12px; font-size: 0.8rem; cursor: pointer; font-family: var(--font-body);
  }
  .aporte-item .editar-guardar { background: var(--gold-deep); color: #FBF6EA; }
  .aporte-item .editar-cancelar { background: none; color: var(--ink-soft); }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Libro de la historia</h1>
      <p>Capítulos armados con IA a partir de las historias detectadas en las charlas.</p>
    </div>
    <a class="volver" href="/app.html">← volver a la bitácora</a>
  </header>
  <div class="wrap">
    <div class="aportes-section" id="aportesSection" style="display:none;">
      <h2>Aportes de la familia</h2>
      <p class="sub">Historias que colaboradores agregaron — puedes corregirlas si hace falta.</p>
      <div id="aportesLista"></div>
    </div>

    <div class="toolbar">
      <button class="generar" id="generarBtn" type="button">Generar capítulos</button>
      <span class="status" id="status"></span>
    </div>
    <div id="lista">
      <p class="empty">Cargando…</p>
    </div>
  </div>

<script>
(function () {
  const lista = document.getElementById('lista');
  const status = document.getElementById('status');
  const generarBtn = document.getElementById('generarBtn');
  const aportesSection = document.getElementById('aportesSection');
  const aportesLista = document.getElementById('aportesLista');

  function crearEditor(item, texto, guardar) {
    const textoEl = item.querySelector('.texto');
    const editarBtn = item.querySelector('.editar-btn');
    const textarea = document.createElement('textarea');
    textarea.value = texto;
    const row = document.createElement('div');
    row.className = 'editar-row';
    const guardarBtn = document.createElement('button');
    guardarBtn.className = 'editar-guardar';
    guardarBtn.type = 'button';
    guardarBtn.textContent = 'Guardar';
    const cancelarBtn = document.createElement('button');
    cancelarBtn.className = 'editar-cancelar';
    cancelarBtn.type = 'button';
    cancelarBtn.textContent = 'Cancelar';
    row.appendChild(guardarBtn);
    row.appendChild(cancelarBtn);
    textoEl.style.display = 'none';
    editarBtn.style.display = 'none';
    item.insertBefore(textarea, editarBtn);
    item.insertBefore(row, editarBtn);
    cancelarBtn.addEventListener('click', () => {
      textarea.remove();
      row.remove();
      textoEl.style.display = '';
      editarBtn.style.display = '';
    });
    guardarBtn.addEventListener('click', async () => {
      const nuevoTexto = textarea.value.trim();
      if (!nuevoTexto) return;
      guardarBtn.disabled = true;
      const ok = await guardar(nuevoTexto);
      if (!ok) { guardarBtn.disabled = false; return; }
      textoEl.textContent = nuevoTexto;
      textarea.remove();
      row.remove();
      textoEl.style.display = '';
      editarBtn.style.display = '';
    });
  }

  async function cargarAportes() {
    try {
      const resp = await fetch('/api/contributions');
      if (!resp.ok) return;
      const data = await resp.json();
      const notes = data.notes || [];
      if (!notes.length) return;
      aportesLista.innerHTML = '';
      notes.forEach((n) => {
        const item = document.createElement('div');
        item.className = 'aporte-item';
        const quien = n.contributor ? n.contributor + (n.parentesco ? ` (${n.parentesco})` : '') : 'Familia';
        const audioTag = n.audio_url ? `<audio controls src="${n.audio_url}"></audio>` : '';
        item.innerHTML = `
          <p class="quien">${quien}</p>
          <div class="texto">${n.texto}</div>
          ${audioTag}
          <button class="editar-btn" type="button">editar</button>
        `;
        item.querySelector('.editar-btn').addEventListener('click', () => {
          crearEditor(item, n.texto, async (nuevoTexto) => {
            try {
              const putResp = await fetch('/api/contributions/' + n.id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: nuevoTexto, contributor: n.contributor, parentesco: n.parentesco }),
              });
              if (putResp.ok) { n.texto = nuevoTexto; return true; }
              return false;
            } catch (e) { return false; }
          });
        });
        aportesLista.appendChild(item);
      });
      aportesSection.style.display = 'block';
    } catch (e) {}
  }

  function renderChapters(chapters) {
    lista.innerHTML = '';
    if (!chapters.length) {
      lista.innerHTML = '<p class="empty">Todavía no hay capítulos generados. Cuando haya historias detectadas en la charla, presiona "Generar capítulos".</p>';
      return;
    }
    chapters.forEach((c) => {
      const div = document.createElement('div');
      div.className = 'chapter';
      const fecha = c.created_at ? new Date(c.created_at).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
      div.innerHTML = `
        <div class="top-row">
          <p class="theme">${c.theme || ''}</p>
          <button class="borrar" type="button">Borrar</button>
        </div>
        <h2>${c.title}</h2>
        <div class="text">${c.generated_text}</div>
        <p class="meta">Armado a partir de ${(c.story_ids || []).length} historia(s)${fecha ? ' · ' + fecha : ''}</p>
      `;
      div.querySelector('.borrar').addEventListener('click', () => borrarCapitulo(c.id, div));
      lista.appendChild(div);
    });
  }

  async function borrarCapitulo(id, div) {
    if (!confirm('¿Borrar este capítulo? No se puede deshacer.')) return;
    try {
      const resp = await fetch('/api/chapters/' + id, { method: 'DELETE' });
      if (!resp.ok) { status.textContent = 'No se pudo borrar el capítulo.'; return; }
      div.remove();
      if (!lista.children.length) renderChapters([]);
    } catch (e) {
      status.textContent = 'Hubo un problema para conectar.';
    }
  }

  async function cargar() {
    try {
      const resp = await fetch('/api/chapters');
      if (resp.status === 401) {
        lista.innerHTML = '<p class="empty">Inicia sesión en la bitácora primero. <a class="volver" href="/app.html">Ir a la bitácora</a></p>';
        generarBtn.disabled = true;
        return;
      }
      if (!resp.ok) throw new Error('fallo');
      const data = await resp.json();
      renderChapters(data.chapters || []);
    } catch (e) {
      lista.innerHTML = '<p class="empty">No se pudieron cargar los capítulos. Intenta de nuevo más tarde.</p>';
    }
  }

  generarBtn.addEventListener('click', async () => {
    generarBtn.disabled = true;
    status.textContent = 'Generando… puede tardar un rato, no cierres esta pestaña.';
    try {
      const resp = await fetch('/api/chapters/generate', { method: 'POST' });
      const data = await resp.json();
      if (!resp.ok) {
        status.textContent = data.error || 'No se pudieron generar los capítulos.';
      } else if (data.message) {
        status.textContent = data.message;
      } else {
        status.textContent = '';
      }
      if (data.chapters) renderChapters(data.chapters);
    } catch (e) {
      status.textContent = 'Hubo un problema para conectar.';
    } finally {
      generarBtn.disabled = false;
    }
  });

  cargar();
  cargarAportes();
})();
</script>
</body>
</html>
