<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Libro de la historia — Los recuerdos de mis viejos</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="/font-size.js"></script>
<style>
  :root {
    --bg: #F5EFE2;
    --ink: #2B241C;
    --ink-soft: #706551;
    --gold-deep: #8F5A20;
    --bubble-user: #EFE6D1;
    --font-display: "Source Serif 4", Georgia, serif;
    --font-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  /* Antes ningún link/botón mostraba nada al enfocar con teclado.
     :focus-visible solo aparece al navegar con Tab, no al hacer clic. */
  :focus-visible { outline: 3px solid var(--gold-deep); outline-offset: 2px; }
  body {
    margin: 0;
    min-height: 100vh;
    /* 100dvh sigue el alto REAL visible del navegador en el celular — a
       diferencia de 100vh a secas, descuenta la barra de direcciones de
       Safari/Chrome cuando está visible, evitando el salto raro al
       aparecer/desaparecer esa barra al hacer scroll. Se declara después
       de 100vh (no en vez de) para que los navegadores viejos que no
       entienden "dvh" se queden con el 100vh de respaldo. */
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    /* env(safe-area-inset-*) evita que el contenido quede debajo del
       notch/Dynamic Island o de la barra inferior en los iPhone con
       pantalla completa (requiere viewport-fit=cover en el <meta
       viewport>, ver arriba) — en el resto de los navegadores estos
       env() valen 0, así que no cambia nada. */
    padding: calc(28px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }
  header { max-width: 720px; margin: 0 auto 20px; display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  h1 { font-family: var(--font-display); font-size: 1.6rem; margin: 0; }
  header p { color: var(--ink-soft); margin: 4px 0 0; font-size: 0.95rem; }
  a.volver { color: var(--gold-deep); font-size: 0.9rem; text-decoration: none; border-bottom: 1px solid var(--gold-deep); display: inline-flex; align-items: center; min-height: 44px; padding: 10px 4px; }

  .wrap { max-width: 720px; margin: 0 auto; }

  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  button.generar {
    border: none; background: var(--gold-deep); color: #FBF6EA; border-radius: 10px;
    padding: 12px 20px; font-weight: 700; font-size: 0.95rem; cursor: pointer; font-family: var(--font-body);
  }
  button.generar:disabled { opacity: 0.6; cursor: default; }
  .status { color: var(--ink-soft); font-size: 0.9rem; }

  .empty { color: var(--ink-soft); font-style: italic; margin-top: 40px; }

  .chapter {
    background: #FBF6EA;
    border: 1px solid #E7DFCC;
    border-radius: 18px;
    padding: 22px 26px;
    margin-bottom: 20px;
  }
  .chapter .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .chapter .theme { color: var(--gold-deep); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; margin: 0 0 4px; }
  .chapter h2 { font-family: var(--font-display); font-size: 1.3rem; margin: 0 0 12px; }
  .chapter .text { white-space: pre-wrap; line-height: 1.6; font-size: 0.98rem; }
  .chapter .meta { color: var(--ink-soft); font-size: 0.875rem; margin-top: 14px; }
  .chapter .borrar {
    border: none; background: none; color: var(--ink-soft); cursor: pointer;
    font-size: 0.875rem; text-decoration: underline; font-family: var(--font-body);
    padding: 10px; margin: -10px -10px 0 0; flex-shrink: 0; border-radius: 8px;
  }
  .chapter .borrar:hover { color: #a33; }

  .aportes-section { margin-bottom: 40px; }
  .aportes-section h2 { font-family: var(--font-display); font-size: 1.2rem; margin: 0 0 4px; }
  .aportes-section .sub { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 16px; }
  .aporte-item {
    background: #FBF6EA; border: 1px solid #E7DFCC; border-radius: 14px;
    padding: 14px 18px; margin-bottom: 12px; font-size: 0.92rem;
  }
  .aporte-item .quien { color: var(--gold-deep); font-weight: 700; font-size: 0.875rem; margin: 0 0 4px; }
  .aporte-item .texto { line-height: 1.5; }
  .aporte-item audio { width: 100%; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Libro de la historia</h1>
      <p>Capítulos armados con IA a partir de las historias detectadas en las charlas.</p>
    </div>
    <a class="volver" href="/app.html">← volver a la bitácora</a>
  </header>
  <div class="wrap">
    <div class="aportes-section" id="aportesSection" style="display:none;">
      <h2>Aportes de la familia</h2>
      <p class="sub">Historias que colaboradores agregaron con su propia voz.</p>
      <div id="aportesLista"></div>
    </div>

    <div class="toolbar">
      <button class="generar" id="generarBtn" type="button">Generar capítulos</button>
      <span class="status" id="status"></span>
    </div>
    <div id="lista">
      <p class="empty">Cargando…</p>
    </div>
  </div>

<script>
(function () {
  const lista = document.getElementById('lista');
  const status = document.getElementById('status');
  const generarBtn = document.getElementById('generarBtn');
  const aportesSection = document.getElementById('aportesSection');
  const aportesLista = document.getElementById('aportesLista');

  // Antes cualquier falla acá (sesión vencida, error del servidor) mostraba
  // el mismo "Hubo un problema para conectar" sin distinguir si hacía
  // falta volver a iniciar sesión o si fue otra cosa.
  function mensajeDeError(resp, data, fallback) {
    if (resp && resp.status === 401) return 'Tu sesión venció — actualiza la página para volver a iniciar sesión.';
    return (data && data.error) || fallback;
  }

  async function cargarAportes() {
    try {
      const resp = await fetch('/api/contributions');
      if (!resp.ok) return;
      const data = await resp.json();
      const notes = data.notes || [];
      if (!notes.length) return;
      aportesLista.innerHTML = '';
      notes.forEach((n) => {
        const item = document.createElement('div');
        item.className = 'aporte-item';
        const quien = n.contributor ? n.contributor + (n.parentesco ? ` (${n.parentesco})` : '') : 'Familia';
        const etiqueta = n.protagonista ? `Historia de ${n.protagonista} — compartida por ${quien}` : quien;
        const urls = (n.audio_urls && n.audio_urls.length) ? n.audio_urls : (n.audio_url ? [n.audio_url] : []);
        const quienP = document.createElement('p');
        quienP.className = 'quien';
        quienP.textContent = etiqueta;
        item.appendChild(quienP);
        const textoDiv = document.createElement('div');
        textoDiv.className = 'texto';
        textoDiv.textContent = n.texto;
        item.appendChild(textoDiv);
        urls.forEach((u) => {
          if (typeof u === 'string' && /^https?:\/\//.test(u)) {
            const audio = document.createElement('audio');
            audio.controls = true;
            audio.src = u;
            item.appendChild(audio);
          }
        });
        aportesLista.appendChild(item);
      });
      aportesSection.style.display = 'block';
    } catch (e) {}
  }

  function renderChapters(chapters) {
    lista.innerHTML = '';
    if (!chapters.length) {
      lista.innerHTML = '<p class="empty">Todavía no hay capítulos generados. Cuando haya historias detectadas en la charla, presiona "Generar capítulos".</p>';
      return;
    }
    chapters.forEach((c) => {
      const div = document.createElement('div');
      div.className = 'chapter';
      const fecha = c.created_at ? new Date(c.created_at).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
      const topRow = document.createElement('div');
      topRow.className = 'top-row';
      const themeP = document.createElement('p');
      themeP.className = 'theme';
      themeP.textContent = c.theme || '';
      topRow.appendChild(themeP);
      const borrarBtn = document.createElement('button');
      borrarBtn.className = 'borrar';
      borrarBtn.type = 'button';
      borrarBtn.textContent = 'Borrar';
      topRow.appendChild(borrarBtn);
      div.appendChild(topRow);
      const h2 = document.createElement('h2');
      h2.textContent = c.title;
      div.appendChild(h2);
      const textDiv = document.createElement('div');
      textDiv.className = 'text';
      textDiv.textContent = c.generated_text;
      div.appendChild(textDiv);
      const metaP = document.createElement('p');
      metaP.className = 'meta';
      metaP.textContent = `Armado a partir de ${(c.story_ids || []).length} historia(s)${fecha ? ' · ' + fecha : ''}`;
      div.appendChild(metaP);
      borrarBtn.addEventListener('click', () => borrarCapitulo(c.id, div, borrarBtn));
      lista.appendChild(div);
    });
  }

  async function borrarCapitulo(id, div, btn) {
    if (!confirm('¿Borrar este capítulo? No se puede deshacer.')) return;
    // Sin esto, un segundo click mientras el primer borrado todavía está en
    // camino podía disparar dos DELETE para el mismo capítulo.
    if (btn) btn.disabled = true;
    try {
      const resp = await fetch('/api/chapters/' + id, { method: 'DELETE' });
      if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        status.textContent = mensajeDeError(resp, data, 'No se pudo borrar el capítulo.');
        if (btn) btn.disabled = false;
        return;
      }
      div.remove();
      if (!lista.children.length) renderChapters([]);
    } catch (e) {
      status.textContent = 'No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.';
      if (btn) btn.disabled = false;
    }
  }

  // "Generar capítulos" agrupa lo que haya en story_log — si todavía no
  // hay ninguna historia detectada, tocar el botón solo hace un viaje al
  // servidor para volver con "no hay nada que generar". Mejor avisar de
  // entrada y dejar el botón deshabilitado, en vez de que la persona lo
  // descubra recién después de esperar la respuesta. Si esta consulta
  // falla (sesión vencida, sin conexión), se deja el botón habilitado
  // como estaba — el servidor sigue validando igual del otro lado.
  async function chequearMaterialDisponible() {
    try {
      const resp = await fetch('/api/story-log');
      if (!resp.ok) return;
      const data = await resp.json();
      const stories = data.stories || [];
      if (!stories.length) {
        generarBtn.disabled = true;
        status.textContent = 'Todavía no hay historias detectadas en tus charlas para armar un capítulo.';
      }
    } catch (e) {}
  }

  async function cargar() {
    try {
      const resp = await fetch('/api/chapters');
      if (resp.status === 401) {
        lista.innerHTML = '<p class="empty">Inicia sesión en la bitácora primero. <a class="volver" href="/app.html">Ir a la bitácora</a></p>';
        generarBtn.disabled = true;
        return;
      }
      if (!resp.ok) throw new Error('fallo');
      const data = await resp.json();
      renderChapters(data.chapters || []);
    } catch (e) {
      lista.innerHTML = '<p class="empty">No se pudieron cargar los capítulos. Intenta de nuevo más tarde.</p>';
    }
  }

  generarBtn.addEventListener('click', async () => {
    generarBtn.disabled = true;
    status.textContent = 'Generando… puede tardar un rato, no cierres esta pestaña.';
    try {
      const resp = await fetch('/api/chapters/generate', { method: 'POST' });
      const data = await resp.json();
      if (!resp.ok) {
        status.textContent = mensajeDeError(resp, data, 'No se pudieron generar los capítulos.');
      } else if (data.message) {
        status.textContent = data.message;
      } else {
        status.textContent = '';
      }
      if (data.chapters) renderChapters(data.chapters);
    } catch (e) {
      status.textContent = 'No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.';
    } finally {
      generarBtn.disabled = false;
    }
  });

  cargar();
  cargarAportes();
  chequearMaterialDisponible();
})();
</script>
</body>
</html>
