<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aportes de la familia — Los recuerdos de mis viejos</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="/font-size.js"></script>
<style>
  :root {
    --bg: #F5EFE2;
    --ink: #2B241C;
    --ink-soft: #706551;
    --gold-deep: #8F5A20;
    --font-display: "Source Serif 4", Georgia, serif;
    --font-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 3px solid var(--gold-deep); outline-offset: 2px; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding: calc(28px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }
  header { max-width: 720px; margin: 0 auto 20px; display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  h1 { font-family: var(--font-display); font-size: 1.6rem; margin: 0; }
  header p { color: var(--ink-soft); margin: 4px 0 0; font-size: 0.95rem; }
  a.volver { color: var(--gold-deep); font-size: 0.9rem; text-decoration: none; border-bottom: 1px solid var(--gold-deep); display: inline-flex; align-items: center; min-height: 44px; padding: 10px 4px; }

  .wrap { max-width: 720px; margin: 0 auto; }

  section { margin-bottom: 40px; }
  section h2 { font-family: var(--font-display); font-size: 1.2rem; margin: 0 0 4px; }
  section .sub { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 16px; }
  .empty { color: var(--ink-soft); font-style: italic; }
  .empty-cta {
    color: var(--gold-deep); font-size: 0.9rem; font-weight: 700; text-decoration: none;
    border-bottom: 1px solid var(--gold-deep); display: inline-flex; align-items: center;
    min-height: 44px; padding: 10px 4px; margin-top: -6px;
  }
  /* Solo para lectores de pantalla — ver el comentario junto a
     #colaboradoresStatus más abajo. */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  .colab-grid { display: flex; flex-wrap: wrap; gap: 14px; }
  .colab-card {
    background: #FBF6EA; border: 1px solid #E7DFCC; border-radius: 14px;
    padding: 18px 20px; min-width: 150px; flex: 1 1 150px; text-align: center;
  }
  .colab-avatar {
    width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--gold-deep);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;
    font-family: var(--font-display); font-size: 1.3rem; color: var(--gold-deep); background: var(--bg);
  }
  .colab-card .nombre { font-weight: 700; margin: 0 0 2px; }
  .colab-card .parentesco { color: var(--gold-deep); font-weight: 700; font-size: 0.8rem; margin: 0 0 4px; text-transform: capitalize; }
  .colab-card .count { color: var(--ink-soft); font-size: 0.85rem; margin: 0; }

  .aporte-item {
    background: #FBF6EA; border: 1px solid #E7DFCC; border-radius: 14px;
    padding: 14px 18px; margin-bottom: 12px; font-size: 0.92rem;
  }
  .aporte-item .quien { color: var(--gold-deep); font-weight: 700; font-size: 0.875rem; margin: 0 0 4px; }
  .aporte-item .texto { line-height: 1.5; white-space: pre-wrap; }
  .aporte-item audio { width: 100%; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Aportes de la familia</h1>
      <p>Quiénes te ayudaron a construir tu bitácora, y lo que contaron.</p>
    </div>
    <a class="volver" href="/app.html">← volver a la bitácora</a>
  </header>
  <!-- <main>, no <div>: mismo criterio que app.html — sin esto un lector de
       pantalla no tiene forma de saltar directo al contenido. -->
  <main class="wrap">
    <section id="colaboradoresSection">
      <h2>Quiénes han colaborado</h2>
      <p class="sub">Familiares que aportaron historias con tu código de invitación.</p>
      <!-- El anuncio corto (aria-live) va aparte del contenido visual: si
         aria-live estuviera en #colaboradoresLista directamente, un lector
         de pantalla anunciaría TODAS las tarjetas de golpe cada vez que la
         lista cambia — acá solo se avisa algo corto como "Se cargaron 3
         colaboradores.", y la lista se explora aparte, a su ritmo. -->
      <p id="colaboradoresStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
      <div id="colaboradoresLista"><p class="empty">Cargando…</p></div>
    </section>

    <section id="aportesSection">
      <h2>Lo que contaron</h2>
      <p class="sub">Las historias completas, con su audio si lo grabaron.</p>
      <p id="aportesStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
      <div id="aportesLista"><p class="empty">Cargando…</p></div>
    </section>
  </main>

<script>
(function () {
  const colaboradoresLista = document.getElementById('colaboradoresLista');
  const colaboradoresStatus = document.getElementById('colaboradoresStatus');
  const aportesLista = document.getElementById('aportesLista');
  const aportesStatus = document.getElementById('aportesStatus');

  // Mismo criterio que el resto de las páginas: si la sesión venció, decirlo
  // claro en vez de mostrar un error genérico de conexión.
  function mensajeDeError(resp, data, fallback) {
    if (resp && resp.status === 401) return 'Tu sesión venció — actualiza la página para volver a iniciar sesión.';
    return (data && data.error) || fallback;
  }

  async function cargarColaboradores() {
    try {
      const resp = await fetch('/api/tree/colaboradores');
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        const msg = mensajeDeError(resp, data, 'No se pudo cargar quiénes colaboraron.');
        colaboradoresStatus.textContent = msg;
        colaboradoresLista.innerHTML = '<p class="empty">' + msg + '</p>';
        return;
      }
      const colaboradores = data.colaboradores || [];
      if (!colaboradores.length) {
        colaboradoresStatus.textContent = 'Todavía nadie ha colaborado.';
        colaboradoresLista.innerHTML = '<p class="empty">Todavía nadie ha colaborado.</p><a class="empty-cta" href="/app.html#inviteToggle">Invitar familiares →</a>';
        return true; // vacío — ver cargarAportes(), evita repetir el mismo CTA dos veces
      }
      colaboradoresStatus.textContent = colaboradores.length === 1 ? 'Se cargó 1 colaborador.' : `Se cargaron ${colaboradores.length} colaboradores.`;
      const grid = document.createElement('div');
      grid.className = 'colab-grid';
      colaboradores.forEach((c) => {
        const card = document.createElement('div');
        card.className = 'colab-card';
        const avatar = document.createElement('div');
        avatar.className = 'colab-avatar';
        avatar.textContent = (c.nombre || '?').trim().charAt(0).toUpperCase();
        card.appendChild(avatar);
        const nombre = document.createElement('p');
        nombre.className = 'nombre';
        nombre.textContent = c.nombre || 'Familiar';
        card.appendChild(nombre);
        if (c.parentesco) {
          const parentesco = document.createElement('p');
          parentesco.className = 'parentesco';
          parentesco.textContent = c.parentesco;
          card.appendChild(parentesco);
        }
        const count = document.createElement('p');
        count.className = 'count';
        count.textContent = c.historias === 1 ? '1 historia aportada' : `${c.historias} historias aportadas`;
        card.appendChild(count);
        grid.appendChild(card);
      });
      colaboradoresLista.innerHTML = '';
      colaboradoresLista.appendChild(grid);
    } catch (e) {
      colaboradoresStatus.textContent = 'No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.';
      colaboradoresLista.innerHTML = '<p class="empty">No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.</p>';
    }
  }

  async function cargarAportes(colaboradoresVacios) {
    try {
      const resp = await fetch('/api/contributions');
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        const msg = mensajeDeError(resp, data, 'No se pudieron cargar los aportes.');
        aportesStatus.textContent = msg;
        aportesLista.innerHTML = '<p class="empty">' + msg + '</p>';
        return;
      }
      const notes = data.notes || [];
      if (!notes.length) {
        // Si arriba (colaboradores) también está vacío, esa sección ya
        // muestra "Invitar familiares →" — repetirlo acá es el mismo CTA
        // dos veces en la misma pantalla, sin agregar nada nuevo.
        aportesStatus.textContent = 'Todavía no hay historias aportadas por la familia.';
        aportesLista.innerHTML = colaboradoresVacios
          ? '<p class="empty">Todavía no hay historias aportadas por la familia.</p>'
          : '<p class="empty">Todavía no hay historias aportadas por la familia.</p><a class="empty-cta" href="/app.html#inviteToggle">Invitar familiares →</a>';
        return;
      }
      aportesStatus.textContent = notes.length === 1 ? 'Se cargó 1 aporte.' : `Se cargaron ${notes.length} aportes.`;
      aportesLista.innerHTML = '';
      notes.forEach((n) => {
        const item = document.createElement('div');
        item.className = 'aporte-item';
        const quien = n.contributor ? n.contributor + (n.parentesco ? ` (${n.parentesco})` : '') : 'Familia';
        const etiqueta = n.protagonista ? `Historia de ${n.protagonista} — compartida por ${quien}` : quien;
        const urls = (n.audio_urls && n.audio_urls.length) ? n.audio_urls : (n.audio_url ? [n.audio_url] : []);
        const quienP = document.createElement('p');
        quienP.className = 'quien';
        quienP.textContent = etiqueta;
        item.appendChild(quienP);
        const textoDiv = document.createElement('div');
        textoDiv.className = 'texto';
        textoDiv.textContent = n.texto;
        item.appendChild(textoDiv);
        urls.forEach((u) => {
          if (typeof u === 'string' && /^https?:\/\//.test(u)) {
            const audio = document.createElement('audio');
            audio.controls = true;
            audio.src = u;
            item.appendChild(audio);
          }
        });
        aportesLista.appendChild(item);
      });
    } catch (e) {
      aportesStatus.textContent = 'No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.';
      aportesLista.innerHTML = '<p class="empty">No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.</p>';
    }
  }

  // Antes las dos llamadas salían en paralelo (más rápido, pero con las
  // dos vacías a la vez no había forma de saber, desde acá, que "aportes"
  // no debía repetir el CTA de "colaboradores"). Encadenarlas es un viaje
  // extra al servidor en el caso más común, pero esta pantalla no es
  // sensible a esa demora.
  (async () => {
    const colaboradoresVacios = await cargarColaboradores();
    await cargarAportes(colaboradoresVacios);
  })();
})();
</script>
</body>
</html>
