<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Historias detectadas — Los recuerdos de mis viejos</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="/font-size.js"></script>
<style>
  :root {
    --bg: #F5EFE2;
    --ink: #2B241C;
    --ink-soft: #706551;
    --gold-deep: #8F5A20;
    --font-display: "Source Serif 4", Georgia, serif;
    --font-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 3px solid var(--gold-deep); outline-offset: 2px; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding: calc(28px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }
  header { max-width: 720px; margin: 0 auto 20px; display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  h1 { font-family: var(--font-display); font-size: 1.6rem; margin: 0; }
  header p { color: var(--ink-soft); margin: 4px 0 0; font-size: 0.95rem; }
  a.volver { color: var(--gold-deep); font-size: 0.9rem; text-decoration: none; border-bottom: 1px solid var(--gold-deep); display: inline-flex; align-items: center; min-height: 44px; padding: 10px 4px; }

  .wrap { max-width: 720px; margin: 0 auto; }
  .empty { color: var(--ink-soft); font-style: italic; }

  .item {
    background: #FBF6EA; border: 1px solid #E7DFCC; border-radius: 14px;
    padding: 14px 18px; margin-bottom: 12px; font-size: 0.92rem;
  }
  .item audio { width: 100%; margin-bottom: 8px; }
  .item strong { color: var(--gold-deep); }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Historias detectadas</h1>
      <p>Cuando lo que cuentas parece una historia completa (no un dato corto), queda anotada acá junto con su audio.</p>
    </div>
    <a class="volver" href="/app.html">← volver a la bitácora</a>
  </header>
  <div class="wrap">
    <div id="storyLogLista"><p class="empty">Cargando…</p></div>
  </div>

<script>
(function () {
  const storyLogLista = document.getElementById('storyLogLista');

  function mensajeDeError(resp, data, fallback) {
    if (resp && resp.status === 401) return 'Tu sesión venció — actualiza la página para volver a iniciar sesión.';
    return (data && data.error) || fallback;
  }

  async function cargarStoryLog() {
    try {
      const resp = await fetch('/api/story-log');
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        storyLogLista.innerHTML = '<p class="empty">' + mensajeDeError(resp, data, 'No se pudieron cargar las historias.') + '</p>';
        return;
      }
      const stories = data.stories || [];
      if (!stories.length) {
        storyLogLista.innerHTML = '<p class="empty">Todavía no hay historias detectadas en tus charlas.</p>';
        return;
      }
      storyLogLista.innerHTML = '';
      stories.forEach((s) => {
        const div = document.createElement('div');
        div.className = 'item';
        const fecha = new Date(s.created_at).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
        if (typeof s.audio_url === 'string' && /^https?:\/\//.test(s.audio_url)) {
          const audio = document.createElement('audio');
          audio.controls = true;
          audio.src = s.audio_url;
          div.appendChild(audio);
        } else {
          const em = document.createElement('em');
          em.textContent = '(sin audio guardado)';
          div.appendChild(em);
          div.appendChild(document.createElement('br'));
        }
        const textoWrap = document.createElement('div');
        const strong = document.createElement('strong');
        strong.textContent = fecha + ':';
        textoWrap.appendChild(strong);
        textoWrap.appendChild(document.createTextNode(' ' + s.texto));
        div.appendChild(textoWrap);
        storyLogLista.appendChild(div);
      });
    } catch (e) {
      storyLogLista.innerHTML = '<p class="empty">No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.</p>';
    }
  }

  cargarStoryLog();
})();
</script>
</body>
</html>
