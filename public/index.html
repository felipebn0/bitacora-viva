<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora Viva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5EFE2;
    --ink: #2B241C;
    --ink-soft: #8A7C63;
    --gold: #C98A3C;
    --gold-deep: #A86A26;
    --moss: #5B6B45;
    --bubble-user: #EFE6D1;
    --ring: rgba(201, 138, 60, 0.35);
    --font-display: "Source Serif 4", Georgia, serif;
    --font-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; }
  }
  .device {
    width: min(440px, 100%);
    min-height: 560px;
    background: #FBF6EA;
    border-radius: 28px;
    box-shadow: 0 30px 60px -25px rgba(0,0,0,0.35);
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 1.4rem;
    margin: 0;
    text-align: center;
    font-weight: 600;
  }
  .body-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
  }
  .greeting .sub { color: var(--ink-soft); font-size: 0.95rem; max-width: 26ch; margin: 0 auto; }
  .transcript {
    display: none;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    overflow-y: auto;
    max-height: 380px;
    flex: 1;
  }
  .transcript.visible { display: flex; }
  .bubble { max-width: 90%; text-align: left; }
  .bubble.q { align-self: flex-start; font-family: var(--font-display); font-style: italic; color: var(--moss); font-size: 1.05rem; }
  .bubble.a { align-self: flex-end; background: var(--bubble-user); padding: 8px 12px; border-radius: 12px; border-bottom-right-radius: 3px; font-size: 0.95rem; }
  .orb-zone { display: grid; justify-items: center; gap: 12px; }
  .orb {
    width: 168px; height: 168px; border-radius: 50%; border: none; cursor: pointer;
    position: relative; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, var(--gold), var(--gold-deep));
    color: #FBF6EA; font-family: var(--font-body); font-weight: 700; font-size: 1.05rem;
    box-shadow: 0 10px 26px -10px rgba(168,106,38,0.55);
  }
  .orb::before {
    content: ""; position: absolute; inset: -14px; border-radius: 50%;
    border: 2px solid var(--ring); animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { transform: scale(1); opacity: .6; } 50% { transform: scale(1.08); opacity: .15; } }
  .orb[data-state="listening"] { background: radial-gradient(circle at 35% 30%, #D9A15C, var(--gold-deep)); }
  .orb[data-state="listening"]::before { animation-duration: 1.4s; }
  .orb[data-state="speaking"], .orb[data-state="thinking"] { background: radial-gradient(circle at 35% 30%, #6E7F53, var(--moss)); }
  .state-label { font-size: 0.9rem; color: var(--ink-soft); min-height: 1.3em; }
  .write-toggle { background: none; border: none; color: var(--moss); text-decoration: underline; cursor: pointer; font-family: var(--font-body); }
  .write-row { display: none; gap: 8px; width: 100%; max-width: 280px; }
  .write-row.visible { display: flex; }
  .write-row input, .write-row select { flex: 1; border: 1px solid #E7DFCC; border-radius: 10px; padding: 9px 12px; font-family: var(--font-body); background: #fff; color: var(--ink); }
  .write-row button { border: none; background: var(--moss); color: #FBF6EA; border-radius: 10px; padding: 0 14px; font-weight: 700; cursor: pointer; }
  .error { color: #a33; font-size: 0.85rem; }

  .familia {
    display: none; /* oculto en mobile por ahora; vuelve a aparecer en pantallas grandes */
    width: min(440px, 100%);
    margin: 28px auto 0;
    background: #FBF6EA;
    border: 1px solid #E7DFCC;
    border-radius: 20px;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .familia h2 {
    font-family: var(--font-display);
    font-size: 1.1rem;
    margin: 0;
    font-weight: 600;
  }
  .familia .sub { color: var(--ink-soft); font-size: 0.9rem; margin: 0; }
  .familia-chat {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 260px;
    overflow-y: auto;
  }
  .familia-bubble { max-width: 92%; font-size: 0.92rem; line-height: 1.4; }
  .familia-bubble.q { align-self: flex-end; background: var(--bubble-user); padding: 8px 12px; border-radius: 12px; border-bottom-right-radius: 3px; }
  .familia-bubble.a { align-self: flex-start; color: var(--ink); }
  .familia-bubble.thinking { align-self: flex-start; color: var(--ink-soft); font-style: italic; }
  .familia-input-row { display: flex; gap: 8px; }
  .familia-input-row input { flex: 1; border: 1px solid #E7DFCC; border-radius: 10px; padding: 10px 12px; font-family: var(--font-body); background: #fff; color: var(--ink); }
  .familia-input-row button { border: none; background: var(--moss); color: #FBF6EA; border-radius: 10px; padding: 0 16px; font-weight: 700; cursor: pointer; }
  .familia-input-row button:disabled { opacity: 0.6; cursor: default; }

  @media (min-width: 700px) {
    .familia { display: flex; }
  }
</style>
</head>
<body>
  <div class="device">
    <h1>Bitácora Viva</h1>
    <div class="body-area">
      <div class="greeting" id="greeting">
        <div class="sub">Presioná el botón para empezar a charlar.</div>
      </div>
      <div class="transcript" id="transcript" aria-live="polite"></div>
      <div class="orb-zone">
        <button class="orb" id="orb" data-state="idle" aria-label="Presionar para comenzar la charla">
          <span id="orbLabel">Presioná<br>para hablar</span>
        </button>
        <div class="state-label" id="stateLabel"></div>
        <button class="write-toggle" id="writeToggle" type="button">prefiero escribir</button>
        <div class="write-row" id="writeRow">
          <input type="text" id="writeInput" placeholder="Escribí tu respuesta…" aria-label="Escribir respuesta">
          <button id="writeSend" type="button">Enviar</button>
        </div>
        <button class="write-toggle" id="voiceToggle" type="button">cambiar voz</button>
        <div class="write-row" id="voiceRow">
          <select id="voiceSelect" aria-label="Elegir voz"></select>
        </div>
      </div>
    </div>
  </div>

  <div class="familia">
    <h2>Preguntale a la bitácora</h2>
    <p class="sub">Escribí una pregunta sobre lo que tu papá ya contó (nombres, lugares, historias…).</p>
    <div class="familia-chat" id="familiaChat"></div>
    <div class="familia-input-row">
      <input type="text" id="familiaInput" placeholder="Ej: ¿cómo se llamaban sus papás?">
      <button id="familiaAsk" type="button">Preguntar</button>
    </div>
  </div>

<script>
(function () {
  const orb = document.getElementById('orb');
  const orbLabel = document.getElementById('orbLabel');
  const stateLabel = document.getElementById('stateLabel');
  const greeting = document.getElementById('greeting');
  const transcript = document.getElementById('transcript');
  const writeToggle = document.getElementById('writeToggle');
  const writeRow = document.getElementById('writeRow');
  const writeInput = document.getElementById('writeInput');
  const writeSend = document.getElementById('writeSend');
  const voiceToggle = document.getElementById('voiceToggle');
  const voiceRow = document.getElementById('voiceRow');
  const voiceSelect = document.getElementById('voiceSelect');

  let history = [];       // lo que se le manda a Claude (solo role/content)
  let sessionLog = [];    // lo que se guarda en la bitácora (incluye audio)
  let sessionKey = null;  // carpeta de audio de esta charla
  let turnIndex = 0;
  let state = 'idle';
  let sessionId = 0;
  let mediaStream = null;
  let mediaRecorder = null;
  let audioChunks = [];

  // Respaldo gratis: si el servidor no puede transcribir (por ejemplo, sin
  // crédito de ElevenLabs), usamos el reconocimiento de voz del navegador
  // como plan B. Solo existe en Chrome de escritorio, no en iPad/Safari —
  // por eso es respaldo y no el camino principal.
  function initFallbackRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const r = new SR();
    r.lang = 'es-CO';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    return r;
  }
  const fallbackRecognition = initFallbackRecognition();
  let fallbackTranscript = '';
  if (fallbackRecognition) {
    fallbackRecognition.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          fallbackTranscript += (fallbackTranscript ? ' ' : '') + e.results[i][0].transcript;
        }
      }
    };
    fallbackRecognition.onerror = () => {};
  }

  async function startRecordingAudio() {
    try {
      if (!mediaStream) {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      }
      audioChunks = [];
      mediaRecorder = new MediaRecorder(mediaStream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.start();
    } catch (e) {
      mediaRecorder = null; // sin permiso de mic aparte: seguimos solo con el texto
    }
  }

  function stopRecordingAudio() {
    return new Promise((resolve) => {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') { resolve(null); return; }
      mediaRecorder.onstop = () => resolve(new Blob(audioChunks, { type: 'audio/webm' }));
      mediaRecorder.stop();
    });
  }

  function releaseMic() {
    stopVoiceActivityDetection();
    if (audioContext) { audioContext.close(); audioContext = null; }
    if (mediaStream) {
      mediaStream.getTracks().forEach((t) => t.stop());
      mediaStream = null;
    }
  }

  async function uploadAudio(blob, role, index, contentType) {
    if (!sessionKey || !blob) return null;
    try {
      const resp = await fetch(
        `/api/save-audio?sessionId=${encodeURIComponent(sessionKey)}&index=${index}&role=${role}`,
        { method: 'POST', headers: { 'Content-Type': contentType }, body: blob }
      );
      if (!resp.ok) return null;
      const data = await resp.json();
      return data.file || null;
    } catch (e) { return null; }
  }
  let voices = [];
  let selectedVoice = null;

  function scoreVoice(v) {
    const n = v.name.toLowerCase();
    let score = 0;
    if (n.includes('google')) score += 3;
    if (n.includes('enhanced') || n.includes('mejorada') || n.includes('premium') || n.includes('neural')) score += 4;
    if (/^es-co$/i.test(v.lang) || n.includes('colombia')) score += 5;
    if (/^es-(es|419|us|mx|ar)$/i.test(v.lang)) score += 1;
    if (v.localService === false) score += 1;
    return score;
  }

  function populateVoiceSelect() {
    voiceSelect.innerHTML = '';
    voices.forEach((v) => {
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = v.name + ' (' + v.lang + ')';
      voiceSelect.appendChild(opt);
    });
  }

  function loadVoices() {
    const all = speechSynthesis.getVoices();
    voices = all.filter((v) => v.lang && v.lang.toLowerCase().startsWith('es'));
    if (!voices.length) voices = all;
    if (!voices.length) return;
    populateVoiceSelect();
    const savedName = localStorage.getItem('bitacoraVoiceName');
    const saved = savedName && voices.find((v) => v.name === savedName);
    selectedVoice = saved || [...voices].sort((a, b) => scoreVoice(b) - scoreVoice(a))[0];
    voiceSelect.value = selectedVoice.name;
  }

  voiceSelect.addEventListener('change', () => {
    selectedVoice = voices.find((v) => v.name === voiceSelect.value) || null;
    if (selectedVoice) localStorage.setItem('bitacoraVoiceName', selectedVoice.name);
  });

  voiceToggle.addEventListener('click', () => voiceRow.classList.toggle('visible'));

  if ('speechSynthesis' in window) {
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function setState(next, label) {
    state = next;
    orb.dataset.state = next;
    stateLabel.textContent = label || '';
    orb.setAttribute(
      'aria-label',
      next === 'idle' || next === 'ended' ? 'Presionar para comenzar la charla' : 'Presionar para terminar la charla'
    );
  }

  function speakWithSystemVoice(text, onEnd) {
    if (!('speechSynthesis' in window)) { if (onEnd) onEnd(); return; }
    try {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = selectedVoice ? selectedVoice.lang : 'es-CO';
      if (selectedVoice) utter.voice = selectedVoice;
      utter.rate = 0.95;
      utter.onend = onEnd || null;
      utter.onerror = onEnd || null;
      speechSynthesis.speak(utter);
    } catch (e) { if (onEnd) onEnd(); }
  }

  // Un solo elemento <audio>, reutilizado en todo el turno. En iPad/Safari,
  // reproducir audio que no viene pegado a un toque se bloquea — reusar el
  // mismo elemento que se "desbloqueó" con el primer toque evita que caiga
  // a la voz del sistema (Siri) a mitad de charla.
  let ttsAudioEl = null;
  const SILENT_AUDIO = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAAABkYXRhAAAAAA==';

  function unlockAudioPlayback() {
    if (!ttsAudioEl) ttsAudioEl = new Audio();
    ttsAudioEl.src = SILENT_AUDIO;
    ttsAudioEl.play().catch(() => {});
  }

  async function speak(text, onEnd, logEntry, index) {
    try {
      const resp = await fetch('/api/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (!resp.ok) throw new Error('tts-unavailable');
      const blob = await resp.blob();
      if (logEntry && index != null) {
        uploadAudio(blob, 'assistant', index, 'audio/mpeg').then((file) => {
          if (file) logEntry.audioFile = file;
        });
      }
      const url = URL.createObjectURL(blob);
      if (!ttsAudioEl) ttsAudioEl = new Audio();
      ttsAudioEl.src = url;
      ttsAudioEl.onended = () => { URL.revokeObjectURL(url); if (onEnd) onEnd(); };
      ttsAudioEl.onerror = () => { URL.revokeObjectURL(url); speakWithSystemVoice(text, onEnd); };
      await ttsAudioEl.play();
    } catch (err) {
      // la voz del sistema no se puede grabar: solo queda el texto para este turno
      speakWithSystemVoice(text, onEnd);
    }
  }

  function addBubble(kind, text) {
    const div = document.createElement('div');
    div.className = 'bubble ' + kind;
    div.textContent = text;
    transcript.appendChild(div);
    transcript.scrollTop = transcript.scrollHeight;
  }

  // Detección de pausas por volumen (en vez del reconocimiento de voz del
  // navegador, que Safari/iPad no soportan): mientras haya sonido, seguimos
  // escuchando; recién cuando pasan SILENCE_MS sin volumen, cerramos la
  // grabación y la mandamos al servidor para transcribirla.
  const SILENCE_MS = 2000; // pausa tolerada antes de dar la respuesta por terminada
  const VAD_THRESHOLD = 0.02; // umbral de volumen para considerar que hay voz
  let audioContext = null;
  let analyser = null;
  let vadRafId = null;
  let vadActive = false;
  let lastLoudTime = 0;

  function startVoiceActivityDetection() {
    if (!mediaStream) return;
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioContext.state === 'suspended') audioContext.resume();
    const source = audioContext.createMediaStreamSource(mediaStream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);

    const data = new Uint8Array(analyser.frequencyBinCount);
    lastLoudTime = Date.now();
    vadActive = true;

    function tick() {
      if (!vadActive) return;
      analyser.getByteTimeDomainData(data);
      let sumSquares = 0;
      for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sumSquares += v * v;
      }
      const rms = Math.sqrt(sumSquares / data.length);
      if (rms > VAD_THRESHOLD) lastLoudTime = Date.now();

      if (Date.now() - lastLoudTime > SILENCE_MS) {
        stopVoiceActivityDetection();
        finalizeSpokenAnswer();
        return;
      }
      vadRafId = requestAnimationFrame(tick);
    }
    tick();
  }

  function stopVoiceActivityDetection() {
    vadActive = false;
    if (vadRafId) cancelAnimationFrame(vadRafId);
    vadRafId = null;
  }

  async function transcribeAudio(blob) {
    try {
      const resp = await fetch('/api/transcribe', {
        method: 'POST',
        headers: { 'Content-Type': blob.type || 'audio/webm' },
        body: blob,
      });
      if (!resp.ok) return '';
      const data = await resp.json();
      return (data.text || '').trim();
    } catch (e) {
      return '';
    }
  }

  async function finalizeSpokenAnswer() {
    if (fallbackRecognition) { try { fallbackRecognition.stop(); } catch (e) {} }
    const audioBlob = await stopRecordingAudio();
    if (!audioBlob || audioBlob.size < 800) {
      writeRow.classList.add('visible');
      writeInput.focus();
      stateLabel.textContent = 'No te escuché bien — escribí tu respuesta o presioná de nuevo.';
      return;
    }
    setState('thinking', 'Transcribiendo…');
    let text = await transcribeAudio(audioBlob);
    if (!text && fallbackTranscript.trim()) {
      text = fallbackTranscript.trim(); // el servidor no pudo: usamos lo que captó el navegador
    }
    if (text) {
      handleAnswer(text, audioBlob);
    } else {
      writeRow.classList.add('visible');
      writeInput.focus();
      stateLabel.textContent = 'No te escuché bien — escribí tu respuesta o presioná de nuevo.';
    }
  }

  async function fetchNext() {
    const mySession = sessionId;
    setState('thinking', 'Pensando…');
    orbLabel.innerHTML = '···';
    try {
      const resp = await fetch('/api/next', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history }),
      });
      if (mySession !== sessionId) return;
      if (!resp.ok) throw new Error('server error');
      const data = await resp.json();
      if (mySession !== sessionId) return;
      turnIndex += 1;
      const myTurn = turnIndex;
      history.push({ role: 'assistant', content: data.message });
      const logEntry = { role: 'assistant', content: data.message, timestamp: new Date().toISOString() };
      sessionLog.push(logEntry);
      addBubble('q', data.message);
      setState('speaking', 'Hablando…');
      speak(data.message, () => {
        if (mySession !== sessionId) return;
        if (data.done) {
          finishSession();
        } else {
          listenForAnswer();
        }
      }, logEntry, myTurn);
    } catch (err) {
      if (mySession !== sessionId) return;
      stateLabel.textContent = 'Hubo un problema para conectar. Probá de nuevo.';
      setState('idle', stateLabel.textContent);
      orbLabel.innerHTML = 'Presioná<br>para hablar';
    }
  }

  async function requestGracefulStop() {
    stopVoiceActivityDetection();
    if (fallbackRecognition) { try { fallbackRecognition.abort(); } catch (e) {} }
    sessionId += 1; // invalida cualquier respuesta pendiente de este turno
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    await stopRecordingAudio();
    writeRow.classList.remove('visible');

    history.push({
      role: 'user',
      content:
        '(La persona presionó el botón para terminar la charla por ahora, a mitad de la conversación. Cierra con un mensaje cálido y empático que incluya un mini resumen de 1 o 2 frases de lo que se habló hoy, y las ganas de seguir charlando otro día. Termina ese mensaje, y solo ese, con [FIN].)',
    });

    fetchNext();
  }

  async function listenForAnswer() {
    setState('listening', 'Escuchando…');
    orbLabel.innerHTML = 'Escuchando<br>…';
    writeToggle.style.display = 'inline';
    if (!window.MediaRecorder || !navigator.mediaDevices) return; // sin soporte: queda "prefiero escribir"
    await startRecordingAudio();
    startVoiceActivityDetection();
    if (fallbackRecognition) {
      fallbackTranscript = '';
      try { fallbackRecognition.start(); } catch (e) {}
    }
  }

  async function handleAnswer(text, audioBlob) {
    if (!text || !text.trim()) return;
    if (audioBlob === undefined && mediaRecorder && mediaRecorder.state !== 'inactive') {
      stopVoiceActivityDetection();
      await stopRecordingAudio(); // vino de "escribir": se descarta la grabación en curso
    }
    addBubble('a', text.trim());
    turnIndex += 1;
    const myTurn = turnIndex;
    history.push({ role: 'user', content: text.trim() });
    const logEntry = { role: 'user', content: text.trim(), timestamp: new Date().toISOString() };
    sessionLog.push(logEntry);
    writeRow.classList.remove('visible');
    writeInput.value = '';
    if (audioBlob) {
      const file = await uploadAudio(audioBlob, 'user', myTurn, 'audio/webm');
      if (file) logEntry.audioFile = file;
    }
    fetchNext();
  }

  async function finishSession() {
    setState('ended', '');
    orbLabel.innerHTML = 'Presioná<br>para otra charla';
    writeToggle.style.display = 'none';
    releaseMic();
    try {
      await fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history: sessionLog }),
      });
    } catch (e) {}
  }

  function startSession() {
    if (state !== 'idle' && state !== 'ended') return;
    sessionId += 1;
    greeting.style.display = 'none';
    transcript.classList.add('visible');
    transcript.innerHTML = '';
    history = [];
    sessionLog = [];
    turnIndex = 0;
    sessionKey = new Date().toISOString().replace(/[:.]/g, '-');
    fetchNext();
  }

  function handleOrbPress() {
    if (state === 'idle' || state === 'ended') {
      unlockAudioPlayback();
      startSession();
    } else {
      requestGracefulStop();
    }
  }

  orb.addEventListener('click', handleOrbPress);

  // Botón físico: el encoder USB de arcade manda una tecla al presionarlo.
  // Cambiá BUTTON_KEY por la tecla que detectes en el paso de prueba (ver README).
  const BUTTON_KEY = 'Enter';
  document.addEventListener('keydown', (e) => {
    if (e.key === BUTTON_KEY) {
      e.preventDefault();
      handleOrbPress();
    }
  });

  writeToggle.addEventListener('click', () => {
    writeRow.classList.toggle('visible');
    if (writeRow.classList.contains('visible')) writeInput.focus();
  });
  writeSend.addEventListener('click', () => handleAnswer(writeInput.value));
  writeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAnswer(writeInput.value); });

  if (!window.MediaRecorder || !navigator.mediaDevices) {
    writeToggle.textContent = 'escribir respuesta';
  }

  // --- Preguntale a la bitácora ---
  const familiaChat = document.getElementById('familiaChat');
  const familiaInput = document.getElementById('familiaInput');
  const familiaAsk = document.getElementById('familiaAsk');

  function addFamiliaBubble(kind, text) {
    const div = document.createElement('div');
    div.className = 'familia-bubble ' + kind;
    div.textContent = text;
    familiaChat.appendChild(div);
    familiaChat.scrollTop = familiaChat.scrollHeight;
    return div;
  }

  async function askFamilia() {
    const q = familiaInput.value.trim();
    if (!q) return;
    addFamiliaBubble('q', q);
    familiaInput.value = '';
    familiaAsk.disabled = true;
    const thinking = addFamiliaBubble('thinking', 'Buscando en la bitácora…');
    try {
      const resp = await fetch('/api/ask-familia', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q }),
      });
      const data = await resp.json();
      thinking.remove();
      addFamiliaBubble('a', data.answer || 'No se pudo responder.');
    } catch (e) {
      thinking.remove();
      addFamiliaBubble('a', 'Hubo un problema para conectar.');
    }
    familiaAsk.disabled = false;
    familiaInput.focus();
  }

  familiaAsk.addEventListener('click', askFamilia);
  familiaInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') askFamilia(); });
})();
</script>
</body>
</html>
