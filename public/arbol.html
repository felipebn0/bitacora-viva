<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árbol genealógico — Los recuerdos de mis viejos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5EFE2;
    --ink: #2B241C;
    --ink-soft: #8A7C63;
    --gold-deep: #A86A26;
    --moss: #5B6B45;
    --bubble-user: #EFE6D1;
    --font-display: "Source Serif 4", Georgia, serif;
    --font-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding: 28px 20px 60px;
    position: relative;
    overflow-x: hidden;
  }
  .leaf { position: fixed; font-size: 2.4rem; opacity: 0.25; pointer-events: none; z-index: 0; }
  .leaf.tl { top: 10px; left: 10px; transform: rotate(-15deg); }
  .leaf.tr { top: 10px; right: 10px; transform: rotate(20deg) scaleX(-1); }
  .leaf.bl { bottom: 10px; left: 10px; transform: rotate(160deg) scaleX(-1); }
  .leaf.br { bottom: 10px; right: 10px; transform: rotate(-160deg); }

  header { max-width: 1400px; margin: 0 auto 28px; display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; position: relative; z-index: 1; text-align: center; }
  h1 { font-family: var(--font-display); font-size: 1.8rem; margin: 0; width: 100%; text-align: center; }
  header p { color: var(--ink-soft); margin: 4px 0 0; font-size: 0.95rem; width: 100%; text-align: center; }
  a.volver { color: var(--gold-deep); font-size: 0.9rem; text-decoration: none; border-bottom: 1px solid var(--gold-deep); position: absolute; right: 0; top: 0; }

  .wrap { max-width: 1400px; margin: 0 auto; overflow-x: auto; padding-bottom: 12px; position: relative; z-index: 1; }
  .empty, .msg { color: var(--ink-soft); font-style: italic; text-align: center; margin-top: 60px; }

  .tree-graphic { position: relative; display: flex; flex-direction: column; gap: 52px; padding: 10px; width: max-content; min-width: 100%; }
  .tree-row { display: flex; flex-wrap: nowrap; justify-content: center; gap: 26px; position: relative; z-index: 1; width: max-content; margin: 0 auto; }
  .tree-lines { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 0; overflow: visible; }
  .tree-lines line { stroke: #B7A87E; stroke-width: 2; }

  .tree-node { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 108px; }
  .avatar {
    width: 68px; height: 68px; border-radius: 50%;
    background: var(--bubble-user);
    border: 3px solid var(--moss);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--moss);
    box-shadow: 0 4px 10px -4px rgba(0,0,0,0.25);
  }
  .tree-node.principal .avatar { background: var(--gold-deep); border-color: var(--gold-deep); color: #FBF6EA; }
  .tree-node strong { display: block; color: var(--ink); font-size: 0.9rem; line-height: 1.2; }
  .tree-node span { display: block; color: var(--ink-soft); font-size: 0.75rem; }
</style>
</head>
<body>
  <span class="leaf tl">🌿</span>
  <span class="leaf tr">🌿</span>
  <span class="leaf bl">🌿</span>
  <span class="leaf br">🌿</span>
  <header>
    <h1>Árbol genealógico</h1>
    <p>Se va armando solo con lo que se cuenta en las charlas.</p>
    <a class="volver" href="/app.html">← volver a la bitácora</a>
  </header>
  <div class="wrap" id="wrap">
    <p class="msg">Cargando…</p>
  </div>

<script>
(function () {
  const wrap = document.getElementById('wrap');

  function tierForRelacion(relacion) {
    const r = (relacion || '').toLowerCase();
    if (/abuel/.test(r)) return 0;
    if (/(pap[aá]|padre|mam[aá]|madre|t[ií]o|t[ií]a)/.test(r)) return 1;
    if (/(nieto|nieta)/.test(r)) return 4;
    if (/(hijo|hija|sobrin)/.test(r)) return 3;
    return 2; // hermanos, esposo/a, primos, sujeto principal
  }

  function esNovio(relacion) {
    return /\bnovi[oa]\b/i.test(relacion || '');
  }

  function initials(nombre) {
    return (nombre || '')
      .trim()
      .split(/\s+/)
      .slice(0, 2)
      .map((w) => w[0])
      .join('')
      .toUpperCase();
  }

  function drawLine(svg, x1, y1, x2, y2) {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    svg.appendChild(line);
  }

  // Detecta parejas (dos personas que comparten hijos, según "padres") para
  // poder sentarlas juntas y unirlas con una línea horizontal — así se ve
  // claro quién es pareja de quién, y de esa pareja sale la línea hacia sus
  // hijos, en vez de una sola persona suelta.
  function detectarParejas(people) {
    const partnerOf = new Map();
    people.forEach((p) => {
      const padres = Array.isArray(p.padres) ? p.padres : [];
      if (padres.length === 2) {
        const [a, b] = padres;
        if (a !== b) { partnerOf.set(a, b); partnerOf.set(b, a); }
      }
    });
    return partnerOf;
  }

  // Ordena cada fila agrupando primero por HERMANOS DE SANGRE (mismos
  // padres) — así el bloque de hermanos de Fernando no se separa aunque su
  // esposa Marta tenga sus propios padres distintos. Solo se "pega" a la
  // pareja junto a su grupo cuando esa pareja no tiene padres propios
  // conocidos en el árbol (cuñado/cuñada), que es el único caso donde
  // pegarlos no rompe ningún bloque de hermanos real.
  function ordenarConParejasJuntas(grupo, partnerOf) {
    const key = (p) => {
      const padres = (Array.isArray(p.padres) ? p.padres : []).filter(Boolean);
      return padres.length ? padres.slice().sort().join('|') : null;
    };
    const grupos = new Map(); // clave de padres -> [personas]
    const ordenClaves = [];
    const sinPadres = [];
    grupo.forEach((p) => {
      const k = key(p);
      if (k === null) { sinPadres.push(p); return; }
      if (!grupos.has(k)) { grupos.set(k, []); ordenClaves.push(k); }
      grupos.get(k).push(p);
    });

    // Si dos personas de DOS grupos de hermanos distintos son pareja entre
    // sí (ej. Fernando de un lado, Marta del otro, cada uno con sus propios
    // padres), acomodamos esos dos grupos para que la pareja quede en el
    // borde de contacto — como en un árbol clásico, papá pegado a mamá en
    // el medio y los tíos de cada lado hacia afuera — en vez de dejar a
    // uno de los dos perdido lejos del otro.
    for (let i = 0; i < ordenClaves.length - 1; i++) {
      const grupoA = grupos.get(ordenClaves[i]);
      const grupoB = grupos.get(ordenClaves[i + 1]);
      let puenteA = null;
      let puenteB = null;
      for (const pa of grupoA) {
        const partnerName = partnerOf.get(pa.nombre);
        if (!partnerName) continue;
        const pb = grupoB.find((x) => x.nombre === partnerName);
        if (pb) { puenteA = pa; puenteB = pb; break; }
      }
      if (puenteA && puenteB) {
        grupoA.splice(grupoA.indexOf(puenteA), 1);
        grupoA.push(puenteA); // al final de su grupo, tocando al siguiente
        grupoB.splice(grupoB.indexOf(puenteB), 1);
        grupoB.unshift(puenteB); // al principio del suyo, tocando al anterior
      }
    }

    const result = [];
    const usadosSinPadres = new Set();
    ordenClaves.forEach((k) => {
      grupos.get(k).forEach((p) => {
        result.push(p);
        const partnerName = partnerOf.get(p.nombre);
        if (!partnerName) return;
        const partner = sinPadres.find((x) => x.nombre === partnerName && !usadosSinPadres.has(x.nombre));
        if (partner) { result.push(partner); usadosSinPadres.add(partner.nombre); }
      });
    });
    // Cualquier "sin padres conocidos" que no se pudo pegar a su pareja
    // (no tiene pareja en esta fila) va al final, en su orden original.
    sinPadres.forEach((p) => { if (!usadosSinPadres.has(p.nombre)) result.push(p); });
    return result;
  }

  function renderTree(people) {
    wrap.innerHTML = '';
    if (!people.length) {
      wrap.innerHTML = '<p class="empty">Todavía no hay nadie registrado — va a ir apareciendo a medida que se charla.</p>';
      return;
    }

    const partnerOf = detectarParejas(people);

    const tiers = [[], [], [], [], []];
    people.forEach((p) => { tiers[tierForRelacion(p.relacion)].push(p); });

    // Orden base de cada fila: hermanos de sangre agrupados, con la pareja
    // puente pegada entre dos grupos vecinos.
    const filasOrdenadas = tiers.map((grupo) => (grupo.length ? ordenarConParejasJuntas(grupo, partnerOf) : []));

    // Las filas más arriba (ej. abuelos) no tienen padres propios en el
    // árbol, así que ordenarConParejasJuntas no tiene de qué agarrarse y
    // las deja en su orden original — eso hace que, por ejemplo, la familia
    // de la mamá quede dibujada arriba de la familia del papá. Para
    // evitarlo, esas filas "raíz" se reordenan según dónde terminaron sus
    // propios hijos en la fila de abajo (ya bien ordenada), para que cada
    // familia (ej. Bernal por un lado, Nisperuza por el otro) quede
    // alineada con su propia rama y solo se toquen donde corresponde.
    function esFilaRaiz(fila) {
      return fila.every((p) => !(Array.isArray(p.padres) && p.padres.length));
    }
    function alinearConHijos(filaSuperior, filaInferior) {
      const indexInferior = new Map(filaInferior.map((p, i) => [p.nombre, i]));
      const conPos = filaSuperior.map((p, i) => {
        const hijos = filaInferior.filter((h) => Array.isArray(h.padres) && h.padres.includes(p.nombre));
        const pos = hijos.length
          ? hijos.reduce((s, h) => s + indexInferior.get(h.nombre), 0) / hijos.length
          : i + 0.5; // sin hijos ubicables acá: se queda cerca de su posición original
        return { p, pos };
      });
      conPos.sort((a, b) => a.pos - b.pos);
      return conPos.map((x) => x.p);
    }
    for (let i = 0; i < filasOrdenadas.length - 1; i++) {
      if (!filasOrdenadas[i].length || !esFilaRaiz(filasOrdenadas[i])) continue;
      const siguienteConGente = filasOrdenadas.slice(i + 1).find((f) => f.length);
      if (siguienteConGente) filasOrdenadas[i] = alinearConHijos(filasOrdenadas[i], siguienteConGente);
    }

    const graphic = document.createElement('div');
    graphic.className = 'tree-graphic';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'tree-lines');
    graphic.appendChild(svg);

    const nodeByName = new Map();
    const avatarByName = new Map();
    const rowElDeNombre = new Map(); // nombre -> fila (div .tree-row) a la que pertenece
    const rowElPorFila = []; // mismo índice que filasOrdenadas (filas vacías -> null)
    filasOrdenadas.forEach((grupo) => {
      if (!grupo.length) { rowElPorFila.push(null); return; }
      const row = document.createElement('div');
      row.className = 'tree-row';
      grupo.forEach((p) => {
        const node = document.createElement('div');
        node.className = 'tree-node' + (/sujeto principal/i.test(p.relacion) ? ' principal' : '');
        node.innerHTML = `<div class="avatar">${initials(p.nombre)}</div><strong>${p.nombre}</strong><span>${p.relacion}</span>`;
        row.appendChild(node);
        nodeByName.set(p.nombre, node);
        avatarByName.set(p.nombre, node.querySelector('.avatar'));
        rowElDeNombre.set(p.nombre, row);
      });
      graphic.appendChild(row);
      rowElPorFila.push(row);
    });

    wrap.appendChild(graphic);

    function agruparEnUnidades(fila) {
      const usados = new Set();
      const unidades = [];
      fila.forEach((p) => {
        if (usados.has(p.nombre)) return;
        const partnerName = partnerOf.get(p.nombre);
        const partner = partnerName ? fila.find((x) => x.nombre === partnerName) : null;
        if (partner) { unidades.push([p, partner]); usados.add(p.nombre); usados.add(partner.nombre); }
        else { unidades.push([p]); usados.add(p.nombre); }
      });
      return unidades;
    }

    // Reubica una fila a mano (en vez de dejar que cada una se centre sola
    // con flexbox) para que quede alineada en píxeles con una fila vecina
    // YA finalizada: "abajo" la alinea con sus propios hijos (para la fila
    // más alta del árbol, que no tiene padres propios acá); "arriba" la
    // alinea con sus propios padres (para el resto). Sin esto, filas con
    // cantidades de gente muy distintas (4 arriba, 9 en el medio, 6 abajo)
    // no quedan alineadas aunque el orden sea correcto, y las líneas
    // terminan cruzándose por en medio de gente que no tiene nada que ver.
    function posicionarFila(fila, filaReferencia, direccion, rowEl) {
      const contRect = graphic.getBoundingClientRect();
      // Ojo con el sistema de coordenadas: node.style.left posiciona
      // relativo a rowEl (el padre position:relative), no al gráfico
      // entero — hay que restar dónde arranca la fila.
      const rowRectAntes = rowEl.getBoundingClientRect();
      const rowLeftEnGrafico = rowRectAntes.left - contRect.left;
      const rowAnchoAntes = rowRectAntes.width;

      const xDe = (nombre) => {
        const av = avatarByName.get(nombre);
        if (!av) return null;
        const r = av.getBoundingClientRect();
        return r.left + r.width / 2 - contRect.left;
      };

      const unidades = agruparEnUnidades(fila);
      const conCentro = unidades.map((u, i) => {
        const nombresUnidad = u.map((p) => p.nombre);
        let xs;
        if (direccion === 'abajo') {
          const hijos = filaReferencia.filter(
            (h) => Array.isArray(h.padres) && h.padres.some((pn) => nombresUnidad.includes(pn))
          );
          xs = hijos.map((h) => xDe(h.nombre)).filter((x) => x != null);
        } else {
          const nombresPadres = new Set();
          u.forEach((p) => (Array.isArray(p.padres) ? p.padres : []).forEach((pn) => nombresPadres.add(pn)));
          xs = Array.from(nombresPadres).map((n) => xDe(n)).filter((x) => x != null);
        }
        const centro = xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
        return { u, centro, ordenOriginal: i };
      });
      // Sin referencia ubicable (ej. un cuñado sin padres propios y encima
      // sin pareja en esta fila — no debería pasar, pero por las dudas):
      // se va al final, en su orden original.
      conCentro.forEach((c) => { if (c.centro == null) c.centro = 1e6 + c.ordenOriginal; });
      conCentro.sort((a, b) => a.centro - b.centro);

      const NODE_WIDTH = 108; // igual al width de .tree-node en el CSS
      const GAP_INTERNO = 14; // separación dentro de una pareja
      const GAP_UNIDADES = 26; // separación mínima entre unidades distintas
      conCentro.forEach((c) => { c.ancho = c.u.length === 2 ? NODE_WIDTH * 2 + GAP_INTERNO : NODE_WIDTH; });
      let prevRight = -Infinity;
      conCentro.forEach((c) => {
        let left = c.centro - c.ancho / 2;
        if (left < prevRight + GAP_UNIDADES) left = prevRight + GAP_UNIDADES;
        c.left = left; // left edge del "paquete", en coordenadas del gráfico entero
        prevRight = left + c.ancho;
      });

      // Fijar el tamaño Y LA POSICIÓN de la fila ANTES de sacar a los hijos
      // del flujo normal. "margin: 0 auto" centra la fila según el ancho
      // ACTUAL del gráfico, que sigue cambiando a medida que se procesan
      // más filas (cada una se puede terminar quedando más ancha) — así que
      // dejarlo en auto corre esta fila de lugar más tarde, sin avisar.
      // Por eso se reemplaza por un margen fijo, calculado una sola vez acá.
      rowEl.style.width = rowAnchoAntes + 'px';
      rowEl.style.marginLeft = rowLeftEnGrafico + 'px';
      rowEl.style.marginRight = '0';
      rowEl.style.height = rowEl.offsetHeight + 'px';
      Array.from(rowEl.children).forEach((child) => { child.style.position = 'absolute'; child.style.top = '0'; });
      conCentro.forEach((c) => {
        c.u.forEach((p, i) => {
          const node = nodeByName.get(p.nombre);
          const leftEnGrafico = c.left + i * (NODE_WIDTH + GAP_INTERNO);
          node.style.left = (leftEnGrafico - rowLeftEnGrafico) + 'px';
        });
      });
    }

    requestAnimationFrame(() => {
      // Fila "ancla": la más numerosa se deja tal cual (centrada sola con
      // flexbox, ya bien ordenada) y todas las demás se alinean respecto a
      // ella en cascada — hacia arriba mirando a sus hijos, hacia abajo
      // mirando a sus padres — para que cada fila quede alineada en
      // píxeles con la de al lado, no solo en el orden de la lista.
      const filasConIndice = filasOrdenadas
        .map((fila, i) => ({ fila, i }))
        .filter((x) => x.fila.length);

      if (filasConIndice.length > 1) {
        let anclaIdx = 0;
        filasConIndice.forEach((x, idx) => {
          if (x.fila.length > filasConIndice[anclaIdx].fila.length) anclaIdx = idx;
        });

        // La fila ancla también se fija con margen explícito, ANTES de
        // tocar cualquier otra — si no, sigue centrada con "margin: 0 auto"
        // y se corre sola más tarde cuando el gráfico crece (al recalcular
        // el ancho al final), desalineando todo lo que ya se había puesto
        // en relación a su posición original.
        {
          const anclaRowEl = rowElPorFila[filasConIndice[anclaIdx].i];
          const contRect0 = graphic.getBoundingClientRect();
          const anclaRect = anclaRowEl.getBoundingClientRect();
          anclaRowEl.style.width = anclaRect.width + 'px';
          anclaRowEl.style.marginLeft = (anclaRect.left - contRect0.left) + 'px';
          anclaRowEl.style.marginRight = '0';
        }

        for (let idx = anclaIdx - 1; idx >= 0; idx--) {
          posicionarFila(filasConIndice[idx].fila, filasConIndice[idx + 1].fila, 'abajo', rowElPorFila[filasConIndice[idx].i]);
        }
        for (let idx = anclaIdx + 1; idx < filasConIndice.length; idx++) {
          posicionarFila(filasConIndice[idx].fila, filasConIndice[idx - 1].fila, 'arriba', rowElPorFila[filasConIndice[idx].i]);
        }
      }

      // Al reubicar filas a mano, alguna puede terminar más ancha que el
      // ancho "natural" que el navegador calculó antes (ej. una fila con
      // varias parejas que se van corriendo a la derecha para no pisarse).
      // El gráfico entero se re-mide según dónde quedó parado todo el
      // mundo de verdad, para que el achicado automático de más abajo y
      // las líneas SVG no corten ni midan mal el contenido.
      {
        const contRectPre = graphic.getBoundingClientRect();
        const nodos = Array.from(nodeByName.values());
        const lefts = nodos.map((n) => n.getBoundingClientRect().left - contRectPre.left);
        const rights = nodos.map((n) => n.getBoundingClientRect().right - contRectPre.left);
        const minLeft = Math.min(0, ...lefts);
        const maxRight = Math.max(contRectPre.width, ...rights);
        // Si algo quedó a la izquierda del borde, corremos el gráfico ENTERO
        // (no cada nodo suelto) para no desalinear lo que ya está bien
        // alineado entre sí.
        graphic.style.marginLeft = (minLeft < 0 ? -minLeft : 0) + 'px';
        graphic.style.width = (maxRight - minLeft) + 'px';
      }

      const containerRect = graphic.getBoundingClientRect();
      svg.setAttribute('width', containerRect.width);
      svg.setAttribute('height', containerRect.height);
      svg.setAttribute('viewBox', `0 0 ${containerRect.width} ${containerRect.height}`);

      function centerOf(el) {
        const r = el.getBoundingClientRect();
        return {
          x: r.left + r.width / 2 - containerRect.left,
          y: r.top + r.height / 2 - containerRect.top,
          top: r.top - containerRect.top,
          bottom: r.bottom - containerRect.top,
        };
      }

      // Línea horizontal entre parejas (a la altura de las fotos), una sola
      // vez por pareja.
      const dibujadas = new Set();
      people.forEach((p) => {
        const partnerName = partnerOf.get(p.nombre);
        if (!partnerName) return;
        const key = [p.nombre, partnerName].sort().join('|');
        if (dibujadas.has(key)) return;
        const a = avatarByName.get(p.nombre);
        const b = avatarByName.get(partnerName);
        if (!a || !b) return;
        dibujadas.add(key);
        const ca = centerOf(a);
        const cb = centerOf(b);
        if (Math.abs(ca.y - cb.y) > 2) return; // solo si quedaron en la misma fila
        drawLine(svg, ca.x, ca.y, cb.x, cb.y);
      });

      // Línea de padre/madre real hacia cada hijo (campo "padres"), no por
      // generación genérica — así cada rama va a quien corresponde de verdad.
      // Cuando dos familias distintas quedan una al lado de la otra (ej. los
      // hermanos de un lado y la mamá del otro con muy pocos hijos), sus
      // líneas horizontales pueden terminar ocupando el mismo rango de
      // ancho y verse como una sola barra continua. Para evitarlo, cada
      // grupo de hermanos (mismos padres) que comparte la altura de la
      // transición usa un nivel Y un poco distinto ("escalonado").
      const nivelPorTransicion = new Map(); // "anchorY redondeado" -> Map(claveDePadres -> nivel)
      function nivelDeGrupo(anchorY, claveDePadres) {
        const t = Math.round(anchorY);
        if (!nivelPorTransicion.has(t)) nivelPorTransicion.set(t, new Map());
        const m = nivelPorTransicion.get(t);
        if (!m.has(claveDePadres)) m.set(claveDePadres, m.size);
        return m.get(claveDePadres);
      }

      people.forEach((p) => {
        const childAvatar = avatarByName.get(p.nombre);
        if (!childAvatar) return;
        const padresNombres = (Array.isArray(p.padres) ? p.padres : [])
          .filter((n) => n !== p.nombre && avatarByName.has(n));
        if (!padresNombres.length) return;
        const childC = centerOf(childAvatar);
        const parentCenters = padresNombres.map((n) => centerOf(avatarByName.get(n)));
        // La línea tiene que arrancar DESPUÉS del nombre y el rol (todo el
        // .tree-node), no justo debajo del avatar — si no, pasa por encima
        // del texto en vez de por el espacio vacío entre filas.
        // Usamos el borde de la FILA (altura fija, igual para todos) y no
        // el del nodo individual — un nombre largo (ej. "Paula Franco")
        // puede ocupar dos líneas y quedar más alto que sus vecinos, lo que
        // corría la línea justo encima de ese texto.
        const parentRowBottoms = padresNombres.map((n) => centerOf(rowElDeNombre.get(n)).bottom);
        const anchorY = Math.max(...parentRowBottoms);
        if (anchorY >= childC.top) return; // evita líneas invertidas si el dato viene raro
        const anchorX = parentCenters.reduce((s, c) => s + c.x, 0) / parentCenters.length;

        const claveDePadres = padresNombres.slice().sort().join('|');
        const nivel = nivelDeGrupo(anchorY, claveDePadres);
        const disponible = childC.top - anchorY;
        const paso = Math.min(16, disponible / 5); // no pasarse del espacio real entre filas
        const midY = anchorY + paso * 1.2 + nivel * paso;

        drawLine(svg, anchorX, anchorY, anchorX, midY);
        drawLine(svg, anchorX, midY, childC.x, midY);
        drawLine(svg, childC.x, midY, childC.x, childC.top);
      });

      // El árbol suele ser más ancho que la pantalla (muchos tíos, sobrinos,
      // etc.) — en vez de depender de que se note que hay scroll horizontal,
      // lo achicamos para que entre completo. Si haría falta achicarlo
      // demasiado (letra ilegible), preferimos dejar el scroll.
      const disponibleAncho = wrap.clientWidth;
      const naturalAncho = graphic.scrollWidth;
      const MIN_ESCALA = 0.45;
      if (naturalAncho > disponibleAncho) {
        const escala = Math.max(MIN_ESCALA, disponibleAncho / naturalAncho);
        graphic.style.transform = `scale(${escala})`;
        graphic.style.transformOrigin = 'top left';
        wrap.style.height = (graphic.offsetHeight * escala) + 'px';
      } else {
        graphic.style.transform = '';
        wrap.style.height = '';
      }
    });
  }

  async function cargar() {
    try {
      const resp = await fetch('/api/tree');
      if (resp.status === 401) {
        wrap.innerHTML = '<p class="msg">Iniciá sesión en la bitácora primero. <a class="volver" href="/app.html">Ir a la bitácora</a></p>';
        return;
      }
      if (!resp.ok) throw new Error('fallo');
      const data = await resp.json();
      const people = (data.people || []).filter((p) => !esNovio(p.relacion));
      renderTree(people);
    } catch (e) {
      wrap.innerHTML = '<p class="msg">No se pudo cargar el árbol. Intentá de nuevo más tarde.</p>';
    }
  }

  cargar();
  window.addEventListener('resize', cargar);
})();
</script>
</body>
