<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árbol genealógico — Los recuerdos de mis viejos</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5EFE2;
    --ink: #2B241C;
    --ink-soft: #706551;
    --gold-deep: #8F5A20;
    --moss: #5B6B45;
    --bubble-user: #EFE6D1;
    --font-display: "Source Serif 4", Georgia, serif;
    --font-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding: 28px 20px 60px;
    position: relative;
    overflow-x: hidden;
  }
  .leaf { position: fixed; font-size: 2.4rem; opacity: 0.25; pointer-events: none; z-index: 0; }
  .leaf.tl { top: 10px; left: 10px; transform: rotate(-15deg); }
  .leaf.tr { top: 10px; right: 10px; transform: rotate(20deg) scaleX(-1); }
  .leaf.bl { bottom: 10px; left: 10px; transform: rotate(160deg) scaleX(-1); }
  .leaf.br { bottom: 10px; right: 10px; transform: rotate(-160deg); }

  header { max-width: 1400px; margin: 0 auto 28px; display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; position: relative; z-index: 1; text-align: center; }
  h1 { font-family: var(--font-display); font-size: 1.8rem; margin: 0; width: 100%; text-align: center; }
  header p { color: var(--ink-soft); margin: 4px 0 0; font-size: 0.95rem; width: 100%; text-align: center; }
  /* "volver" y "reconstruir" tenían solo el alto del texto (~17px y ~14px)
     como zona táctil real. min-height:44px (con box-sizing:border-box, ver
     arriba) agranda el área de toque sin agrandar el texto; se apilan una
     debajo de la otra ajustando el "top" de la segunda para que no se
     superpongan. */
  a.volver { color: var(--gold-deep); font-size: 0.9rem; text-decoration: none; border-bottom: 1px solid var(--gold-deep); position: absolute; right: 0; top: 0; display: flex; align-items: center; min-height: 44px; padding: 10px 4px; }
  .rebuild-btn {
    position: absolute; right: 0; top: 44px;
    background: none; border: none; color: var(--ink-soft); font-size: 0.875rem;
    text-decoration: underline; cursor: pointer; font-family: var(--font-body);
    display: flex; align-items: center; min-height: 44px; padding: 10px 4px;
  }
  .rebuild-btn:disabled { opacity: 0.6; cursor: default; }
  /* En pantallas angostas el subtítulo puede pasar a dos líneas — con
     "volver" y "reconstruir" siempre en la esquina (position:absolute,
     apenas 26px de separación) terminaban superpuestos o muy pegados. Acá
     vuelven al flujo normal, como una fila propia debajo del subtítulo. */
  @media (max-width: 560px) {
    a.volver, .rebuild-btn { position: static; }
    header { justify-content: center; gap: 6px 22px; }
  }

  .wrap { max-width: 1400px; margin: 0 auto; overflow-x: auto; padding-bottom: 12px; position: relative; z-index: 1; }
  .empty, .msg { color: var(--ink-soft); font-style: italic; text-align: center; margin-top: 60px; }

  .tree-graphic { position: relative; display: flex; flex-direction: column; gap: 52px; padding: 10px; width: max-content; min-width: 100%; }
  .tree-row { display: flex; flex-wrap: nowrap; justify-content: center; gap: 26px; position: relative; z-index: 1; width: max-content; margin: 0 auto; }
  .tree-lines { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 0; overflow: visible; }
  .tree-lines line { stroke: #B7A87E; stroke-width: 2; }

  .tree-node { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 108px; position: relative; }
  /* Zona de toque de 40px (el mínimo que pide la auditoría) manteniendo el
     ícono chico — el círculo visual sigue del mismo tamaño relativo gracias
     a background-clip/font-size, solo crece el área clickeable. Reubicado
     (top/right) para que, más grande, siga sin salirse del nodo de 108px
     de ancho ni pisar al nodo vecino (26px de separación entre nodos). */
  .tree-node .edit-btn {
    position: absolute; top: -14px; right: 4px; width: 40px; height: 40px;
    border-radius: 50%; background: #FBF6EA; border: 1px solid #E7DFCC;
    font-size: 0.68rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .15s;
  }
  .tree-node:hover .edit-btn, .tree-node:focus-within .edit-btn { opacity: 1; }
  /* En pantallas táctiles no existe ":hover" — sin esto, el botón de editar
     quedaba invisible siempre, sin ninguna pista de que se puede corregir
     un nombre o parentesco mal escrito. */
  @media (hover: none), (pointer: coarse) {
    .tree-node .edit-btn { opacity: 1; }
  }
  .avatar {
    width: 68px; height: 68px; border-radius: 50%;
    background: var(--bubble-user);
    border: 3px solid var(--moss);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--moss);
    box-shadow: 0 4px 10px -4px rgba(0,0,0,0.25);
  }
  .tree-node.principal .avatar { background: var(--gold-deep); border-color: var(--gold-deep); color: #FBF6EA; }
  .tree-node strong { display: block; color: var(--ink); font-size: 0.9rem; line-height: 1.2; }
  .tree-node span { display: block; color: var(--ink-soft); font-size: 0.875rem; }

  .colab-section { max-width: 1000px; margin: 56px auto 0; position: relative; z-index: 1; }
  .colab-section h2 { font-family: var(--font-display); font-size: 1.3rem; text-align: center; margin: 0 0 4px; }
  .colab-section .sub { color: var(--ink-soft); font-size: 0.9rem; text-align: center; margin: 0 0 20px; }
  .colab-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .colab-card {
    background: #FBF6EA; border: 1px solid #E7DFCC; border-radius: 16px;
    padding: 16px 18px; text-align: center;
  }
  .colab-card .avatar { margin: 0 auto 8px; }
  .colab-card strong { display: block; color: var(--ink); font-size: 0.95rem; }
  .colab-card .parentesco { display: block; color: var(--gold-deep); font-size: 0.82rem; font-weight: 700; margin-top: 2px; }
  .colab-card .historias { display: block; color: var(--ink-soft); font-size: 0.78rem; margin-top: 4px; }
</style>
</head>
<body>
  <span class="leaf tl">🌿</span>
  <span class="leaf tr">🌿</span>
  <span class="leaf bl">🌿</span>
  <span class="leaf br">🌿</span>
  <header>
    <h1>Árbol genealógico</h1>
    <p>Se va armando solo con lo que se cuenta en las charlas.</p>
    <a class="volver" href="/app.html">← volver a la bitácora</a>
    <button class="rebuild-btn" id="rebuildBtn" type="button">🔄 reconstruir árbol</button>
  </header>
  <div class="wrap" id="wrap">
    <p class="msg">Cargando…</p>
  </div>

  <section class="colab-section" id="colabSection" style="display:none;">
    <h2>Quiénes han colaborado</h2>
    <p class="sub">Familiares que aportaron historias con su código de invitación.</p>
    <div class="colab-grid" id="colabGrid"></div>
  </section>

<script>
(function () {
  const wrap = document.getElementById('wrap');

  function esNovio(relacion) {
    return /\bnovi[oa]\b/i.test(relacion || '');
  }

  function initials(nombre) {
    return (nombre || '')
      .trim()
      .split(/\s+/)
      .slice(0, 2)
      .map((w) => w[0])
      .join('')
      .toUpperCase();
  }

  function drawLine(svg, x1, y1, x2, y2) {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    svg.appendChild(line);
  }

  // Detecta parejas (dos personas que comparten hijos, según "padres") para
  // poder sentarlas juntas y unirlas con una línea horizontal — así se ve
  // claro quién es pareja de quién, y de esa pareja sale la línea hacia sus
  // hijos, en vez de una sola persona suelta.
  function detectarParejas(people) {
    // Solo cuentan como "pareja" dos NOMBRES que de verdad tienen su propia
    // persona en el árbol — si uno de los dos padres nunca se guardó como
    // persona propia (ej. "hijo de Jorge Vargas y Claudia" pero "Claudia"
    // nunca se registró), no hay con quién pintar la línea ni con quién
    // calcular una generación en común, así que se ignora esa pareja.
    const nombresConocidos = new Set(people.map((p) => p.nombre));
    const partnerOf = new Map();
    people.forEach((p) => {
      const padres = Array.isArray(p.padres) ? p.padres : [];
      if (padres.length === 2) {
        const [a, b] = padres;
        if (a !== b && nombresConocidos.has(a) && nombresConocidos.has(b)) {
          partnerOf.set(a, b); partnerOf.set(b, a);
        }
      }
    });
    return partnerOf;
  }

  // Ordena cada fila agrupando primero por HERMANOS DE SANGRE (mismos
  // padres) — así el bloque de hermanos de Fernando no se separa aunque su
  // esposa Marta tenga sus propios padres distintos. Solo se "pega" a la
  // pareja junto a su grupo cuando esa pareja no tiene padres propios
  // conocidos en el árbol (cuñado/cuñada), que es el único caso donde
  // pegarlos no rompe ningún bloque de hermanos real.
  function ordenarConParejasJuntas(grupo, partnerOf) {
    const key = (p) => {
      const padres = (Array.isArray(p.padres) ? p.padres : []).filter(Boolean);
      return padres.length ? padres.slice().sort().join('|') : null;
    };
    const grupos = new Map(); // clave de padres -> [personas]
    const ordenClaves = [];
    const sinPadres = [];
    grupo.forEach((p) => {
      const k = key(p);
      if (k === null) { sinPadres.push(p); return; }
      if (!grupos.has(k)) { grupos.set(k, []); ordenClaves.push(k); }
      grupos.get(k).push(p);
    });

    // Si dos personas de DOS grupos de hermanos distintos son pareja entre
    // sí (ej. Fernando de un lado, Marta del otro, cada uno con sus propios
    // padres), acomodamos esos dos grupos para que la pareja quede en el
    // borde de contacto — como en un árbol clásico, papá pegado a mamá en
    // el medio y los tíos de cada lado hacia afuera — en vez de dejar a
    // uno de los dos perdido lejos del otro.
    for (let i = 0; i < ordenClaves.length - 1; i++) {
      const grupoA = grupos.get(ordenClaves[i]);
      const grupoB = grupos.get(ordenClaves[i + 1]);
      let puenteA = null;
      let puenteB = null;
      for (const pa of grupoA) {
        const partnerName = partnerOf.get(pa.nombre);
        if (!partnerName) continue;
        const pb = grupoB.find((x) => x.nombre === partnerName);
        if (pb) { puenteA = pa; puenteB = pb; break; }
      }
      if (puenteA && puenteB) {
        grupoA.splice(grupoA.indexOf(puenteA), 1);
        grupoA.push(puenteA); // al final de su grupo, tocando al siguiente
        grupoB.splice(grupoB.indexOf(puenteB), 1);
        grupoB.unshift(puenteB); // al principio del suyo, tocando al anterior
      }
    }

    const result = [];
    const usadosSinPadres = new Set();
    ordenClaves.forEach((k) => {
      grupos.get(k).forEach((p) => {
        result.push(p);
        const partnerName = partnerOf.get(p.nombre);
        if (!partnerName) return;
        const partner = sinPadres.find((x) => x.nombre === partnerName && !usadosSinPadres.has(x.nombre));
        if (partner) { result.push(partner); usadosSinPadres.add(partner.nombre); }
      });
    });
    // Cualquier "sin padres conocidos" que no se pudo pegar a su pareja
    // (no tiene pareja en esta fila) va al final, en su orden original.
    sinPadres.forEach((p) => { if (!usadosSinPadres.has(p.nombre)) result.push(p); });
    return result;
  }

  // A qué generación pertenece cada persona — a partir de la cadena REAL
  // de "padres" (no de palabras clave en "relacion", que se rompía apenas
  // la IA fraseaba distinto a lo esperado, ej. "yo (persona principal)" en
  // vez de "sujeto principal"). Sin padres conocidos = generación 0 (una
  // raíz propia, aunque sea alguien suelto — así nunca desaparece nadie,
  // como sí pasaba antes). Las parejas siempre quedan en la misma
  // generación que su pareja, aunque a uno de los dos no se le conozcan
  // los padres.
  // "depth" se guarda por ID de persona, no por nombre — dos personas
  // distintas pueden llamarse igual (ej. un abuelo y un nieto con el mismo
  // nombre), y cada una necesita su PROPIA profundidad calculada a partir
  // de sus propios padres, no una compartida por casualidad de texto.
  // Para resolver "padres" (que sí se guarda por nombre) usamos "byName",
  // que en caso de nombres repetidos apunta a una sola persona — una
  // ambigüedad real de cómo se guardan los datos, no algo que se pueda
  // arreglar solo con el dibujo del árbol.
  function calcularProfundidades(people, partnerOf) {
    const byName = new Map(people.map((p) => [p.nombre, p]));
    const depth = new Map(); // clave: id

    function profundidadDe(persona, visitando) {
      if (depth.has(persona.id)) return depth.get(persona.id);
      if (visitando.has(persona.id)) return 0; // corta ciclos raros en los datos
      visitando.add(persona.id);
      const padres = (Array.isArray(persona.padres) ? persona.padres : [])
        .map((n) => byName.get(n))
        .filter((pp) => pp && pp.id !== persona.id);
      const d = padres.length ? Math.max(...padres.map((pp) => profundidadDe(pp, visitando))) + 1 : 0;
      depth.set(persona.id, d);
      visitando.delete(persona.id);
      return d;
    }
    people.forEach((p) => profundidadDe(p, new Set()));

    for (let i = 0; i < 5; i++) {
      let cambio = false;
      partnerOf.forEach((partnerName, nombre) => {
        const personaA = byName.get(nombre);
        const personaB = byName.get(partnerName);
        if (!personaA || !personaB) return;
        const m = Math.max(depth.get(personaA.id), depth.get(personaB.id));
        if (depth.get(personaA.id) !== m) { depth.set(personaA.id, m); cambio = true; }
        if (depth.get(personaB.id) !== m) { depth.set(personaB.id, m); cambio = true; }
      });
      people.forEach((p) => {
        const padres = (Array.isArray(p.padres) ? p.padres : [])
          .map((n) => byName.get(n))
          .filter((pp) => pp && pp.id !== p.id);
        if (!padres.length) return;
        const objetivo = Math.max(...padres.map((pp) => depth.get(pp.id))) + 1;
        if (depth.get(p.id) < objetivo) { depth.set(p.id, objetivo); cambio = true; }
      });
      if (!cambio) break;
    }
    return depth;
  }

  // Agrupa una fila en "unidades": una pareja cuenta como una sola unidad
  // (se mueven y se ordenan siempre juntos), alguien sin pareja es su
  // propia unidad de uno.
  function agruparEnUnidades(fila, partnerOf) {
    const usados = new Set();
    const unidades = [];
    fila.forEach((p) => {
      if (usados.has(p.nombre)) return;
      const partnerName = partnerOf.get(p.nombre);
      const partner = partnerName ? fila.find((x) => x.nombre === partnerName) : null;
      if (partner) { unidades.push([p, partner]); usados.add(p.nombre); usados.add(partner.nombre); }
      else { unidades.push([p]); usados.add(p.nombre); }
    });
    return unidades;
  }

  // Ordena una fila mirando dónde quedaron sus propios hijos en la fila de
  // ABAJO (ya ordenada) — de abajo hacia arriba, cada fila se acomoda sola
  // en base a datos reales (quién es hijo de quién), en vez de intentar
  // adivinar el orden de arriba hacia abajo por generación genérica.
  function alinearConHijos(fila, filaInferior, partnerOf) {
    const indexInferior = new Map(filaInferior.map((p, i) => [p.nombre, i]));
    const unidades = agruparEnUnidades(fila, partnerOf);

    const posDeUnidad = (u) => {
      const nombresUnidad = u.map((p) => p.nombre);
      const hijos = filaInferior.filter((h) => Array.isArray(h.padres) && h.padres.some((pn) => nombresUnidad.includes(pn)));
      if (!hijos.length) return null;
      return hijos.reduce((s, h) => s + indexInferior.get(h.nombre), 0) / hijos.length;
    };

    // Primero agrupamos por HERMANOS DE SANGRE (mismos padres) — así
    // alguien sin hijos propios ubicables todavía (ej. un tío soltero)
    // queda pegado a sus hermanos, en vez de que su posición "adivinada"
    // lo termine mezclando con otra familia sin relación.
    const keyDeUnidad = (u, i) => {
      const padres = (Array.isArray(u[0].padres) ? u[0].padres : []).filter(Boolean);
      return padres.length ? padres.slice().sort().join('|') : ('__sin_padres_' + i);
    };
    const clanes = new Map();
    const ordenClanes = [];
    unidades.forEach((u, i) => {
      const k = keyDeUnidad(u, i);
      if (!clanes.has(k)) { clanes.set(k, []); ordenClanes.push(k); }
      clanes.get(k).push(u);
    });

    const conPos = ordenClanes.map((k, i) => {
      const usConPos = clanes.get(k).map((u) => ({ u, pos: posDeUnidad(u) }));
      // Dentro de un mismo clan: primero quienes sí tienen hijos ubicables
      // (ordenados por dónde quedaron), y al final los que no — así el
      // clan entero se mueve como bloque y nunca se separa.
      const resueltas = usConPos.filter((x) => x.pos != null).sort((a, b) => a.pos - b.pos);
      const sinResolver = usConPos.filter((x) => x.pos == null);
      const posClan = resueltas.length
        ? resueltas.reduce((s, x) => s + x.pos, 0) / resueltas.length
        : i + 0.5; // clan sin ningún hijo ubicable: se queda cerca de su posición original
      return { us: resueltas.concat(sinResolver).map((x) => x.u), pos: posClan };
    });
    conPos.sort((a, b) => a.pos - b.pos);
    return conPos.flatMap((c) => c.us.flatMap((u) => u));
  }

  function renderTree(people) {
    wrap.innerHTML = '';
    if (!people.length) {
      wrap.innerHTML = '<p class="empty">Todavía no hay nadie registrado — va a ir apareciendo a medida que se charla.</p>';
      return;
    }

    const partnerOf = detectarParejas(people);

    // La generación de cada quien sale de la cadena real de "padres", no de
    // una lista fija de palabras clave — así el árbol tiene tantas filas
    // como haga falta (bisabuelos, tataranietos, lo que sea) y nadie queda
    // mal clasificado por cómo la IA haya redactado el parentesco.
    const profundidad = calcularProfundidades(people, partnerOf);
    const maxProfundidad = Math.max(...Array.from(profundidad.values()));
    const filas = [];
    for (let d = 0; d <= maxProfundidad; d++) filas.push([]);
    people.forEach((p) => filas[profundidad.get(p.id)].push(p));

    // De abajo hacia arriba: la fila más profunda se ordena agrupando
    // hermanos de sangre (no tiene una fila de abajo de la cual guiarse);
    // cada fila de arriba se acomoda sola mirando dónde quedaron sus
    // propios hijos en la fila de abajo, ya ordenada. Esto reemplaza tener
    // que "adivinar" el orden de arriba hacia abajo.
    const filasOrdenadas = filas.slice();
    if (filasOrdenadas.length) {
      const ultima = filasOrdenadas.length - 1;
      filasOrdenadas[ultima] = ordenarConParejasJuntas(filasOrdenadas[ultima], partnerOf);
      for (let d = ultima - 1; d >= 0; d--) {
        filasOrdenadas[d] = alinearConHijos(filasOrdenadas[d], filasOrdenadas[d + 1], partnerOf);
      }
    }

    const graphic = document.createElement('div');
    graphic.className = 'tree-graphic';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'tree-lines');
    graphic.appendChild(svg);

    // Dos mapas para cada cosa: uno por ID (siempre apunta a UNA sola
    // persona exacta — para "dónde está ESTA persona en particular") y
    // otro por NOMBRE (para resolver a quién se refiere un "padres": ["X"]
    // — ahí sí puede haber ambigüedad si dos personas se llaman igual, ej.
    // un abuelo y un nieto con el mismo nombre). Para esa ambigüedad se
    // prioriza a quien esté en la fila MÁS ANTIGUA (profundidad menor) —
    // que es casi siempre la interpretación correcta cuando el nombre se
    // usa como referencia de "padre de" alguien.
    const nodeById = new Map();
    const avatarById = new Map();
    const rowElDeId = new Map();
    const nodeByName = new Map();
    const avatarByName = new Map();
    const rowElDeNombre = new Map();
    const rowElPorFila = []; // mismo índice que filasOrdenadas (filas vacías -> null)
    filasOrdenadas.forEach((grupo) => {
      if (!grupo.length) { rowElPorFila.push(null); return; }
      const row = document.createElement('div');
      row.className = 'tree-row';
      grupo.forEach((p) => {
        const node = document.createElement('div');
        node.className = 'tree-node' + (/principal/i.test(p.relacion || '') ? ' principal' : '');
        const avatarDiv = document.createElement('div');
        avatarDiv.className = 'avatar';
        avatarDiv.textContent = initials(p.nombre);
        node.appendChild(avatarDiv);
        const nombreStrong = document.createElement('strong');
        nombreStrong.textContent = p.nombre;
        node.appendChild(nombreStrong);
        const relacionSpan = document.createElement('span');
        relacionSpan.textContent = p.relacion;
        node.appendChild(relacionSpan);
        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.type = 'button';
        editBtn.title = 'Corregir nombre o parentesco';
        editBtn.setAttribute('aria-label', 'Corregir nombre o parentesco de ' + p.nombre);
        editBtn.textContent = '✏️';
        node.appendChild(editBtn);
        editBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          editarPersona(p.id, p.nombre, p.relacion, p.padres);
        });
        row.appendChild(node);
        nodeById.set(p.id, node);
        avatarById.set(p.id, node.querySelector('.avatar'));
        rowElDeId.set(p.id, row);
        // filasOrdenadas ya viene de generación más antigua a más nueva, así
        // que la PRIMERA vez que aparece un nombre es la de menor
        // profundidad — los duplicados que vengan después (mismo nombre,
        // generación más nueva) no pisan esa referencia.
        if (!nodeByName.has(p.nombre)) {
          nodeByName.set(p.nombre, node);
          avatarByName.set(p.nombre, node.querySelector('.avatar'));
          rowElDeNombre.set(p.nombre, row);
        }
      });
      graphic.appendChild(row);
      rowElPorFila.push(row);
    });

    wrap.appendChild(graphic);

    // Reubica una fila a mano (en vez de dejar que cada una se centre sola
    // con flexbox) para que quede alineada en píxeles con la fila de ABAJO
    // (ya posicionada de verdad) — cada unidad (persona o pareja) se centra
    // sobre sus propios hijos reales, nunca sobre "los hijos que le tocaron
    // por generación". Se procesa siempre de abajo hacia arriba, así la
    // fila de referencia ya tiene coordenadas reales cuando le toca a la de
    // arriba. Sin esto, filas con cantidades de gente muy distintas (4
    // arriba, 9 en el medio, 6 abajo) no quedan alineadas aunque el orden
    // sea correcto, y las líneas terminan cruzándose.
    function posicionarFila(fila, filaInferior, rowEl) {
      const contRect = graphic.getBoundingClientRect();
      // Ojo con el sistema de coordenadas: node.style.left posiciona
      // relativo a rowEl (el padre position:relative), no al gráfico
      // entero — hay que restar dónde arranca la fila.
      const rowRectAntes = rowEl.getBoundingClientRect();
      const rowLeftEnGrafico = rowRectAntes.left - contRect.left;
      const rowAnchoAntes = rowRectAntes.width;

      // Posición de una persona EXACTA (por id, nunca por nombre) — si dos
      // personas se llaman igual (ej. un abuelo y un nieto), cada una tiene
      // que quedar ubicada según su PROPIO avatar, no el de su tocayo.
      const xDe = (persona) => {
        const av = avatarById.get(persona.id);
        if (!av) return null;
        const r = av.getBoundingClientRect();
        return r.left + r.width / 2 - contRect.left;
      };

      const unidades = agruparEnUnidades(fila, partnerOf);
      const conCentro = unidades.map((u, i) => {
        const nombresUnidad = u.map((p) => p.nombre);
        const hijos = filaInferior.filter(
          (h) => Array.isArray(h.padres) && h.padres.some((pn) => nombresUnidad.includes(pn))
        );
        const xs = hijos.map((h) => xDe(h)).filter((x) => x != null);
        // Sin hijos ubicables todavía (ej. un tío sin hijos registrados en
        // la charla) no hay de dónde sacar un centro real — se usa la
        // posición NATURAL que ya tiene ahora mismo (antes de mover nada),
        // que gracias al orden armado más arriba ya está cerca de donde
        // debería quedar, en vez de un valor inventado que lo manda lejos.
        const centro = xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : xDe(u[0]);
        return { u, centro, ordenOriginal: i };
      });
      // Último recurso, si ni siquiera la posición natural se pudo leer
      // (no debería pasar): centro 0, no afecta el orden (ver más abajo).
      conCentro.forEach((c) => { if (c.centro == null) c.centro = 0; });
      // OJO: acá NO se reordena por centro — el orden ya viene bien armado
      // desde "alinearConHijos" (agrupado por hermanos de sangre). Si acá
      // se reordenara de nuevo mirando solo el centro de CADA unidad suelta
      // (en vez del clan completo), alguien sin hijos ubicables en esta
      // fila (ej. una tía sin hijos) podía terminar intercalado en la
      // familia de al lado, aunque "alinearConHijos" ya lo había dejado
      // bien pegado a sus hermanos. El centro solo se usa para saber DÓNDE
      // en píxeles cae cada quien, no para decidir el orden entre ellos.

      const NODE_WIDTH = 108; // igual al width de .tree-node en el CSS
      const GAP_INTERNO = 14; // separación dentro de una pareja
      const GAP_UNIDADES = 26; // separación mínima entre unidades distintas
      conCentro.forEach((c) => { c.ancho = c.u.length === 2 ? NODE_WIDTH * 2 + GAP_INTERNO : NODE_WIDTH; });
      let prevRight = -Infinity;
      conCentro.forEach((c) => {
        let left = c.centro - c.ancho / 2;
        if (left < prevRight + GAP_UNIDADES) left = prevRight + GAP_UNIDADES;
        c.left = left; // left edge del "paquete", en coordenadas del gráfico entero
        prevRight = left + c.ancho;
      });

      // Fijar el tamaño Y LA POSICIÓN de la fila ANTES de sacar a los hijos
      // del flujo normal. "margin: 0 auto" centra la fila según el ancho
      // ACTUAL del gráfico, que sigue cambiando a medida que se procesan
      // más filas (cada una se puede terminar quedando más ancha) — así que
      // dejarlo en auto corre esta fila de lugar más tarde, sin avisar.
      // Por eso se reemplaza por un margen fijo, calculado una sola vez acá.
      rowEl.style.width = rowAnchoAntes + 'px';
      rowEl.style.marginLeft = rowLeftEnGrafico + 'px';
      rowEl.style.marginRight = '0';
      rowEl.style.height = rowEl.offsetHeight + 'px';
      Array.from(rowEl.children).forEach((child) => { child.style.position = 'absolute'; child.style.top = '0'; });
      conCentro.forEach((c) => {
        c.u.forEach((p, i) => {
          const node = nodeById.get(p.id);
          const leftEnGrafico = c.left + i * (NODE_WIDTH + GAP_INTERNO);
          node.style.left = (leftEnGrafico - rowLeftEnGrafico) + 'px';
        });
      });
    }

    requestAnimationFrame(() => {
      // Siempre de abajo hacia arriba: la fila más profunda (con gente) se
      // deja tal cual quedó centrada sola con flexbox, ya bien ordenada —
      // y cada fila arriba de esa se posiciona mirando a la de abajo, que
      // para entonces ya tiene coordenadas reales. Como el orden de las
      // filas ya viene armado de abajo hacia arriba (ver más arriba), acá
      // solo hace falta seguir la misma dirección para los píxeles.
      const filasConIndice = filasOrdenadas
        .map((fila, i) => ({ fila, i }))
        .filter((x) => x.fila.length);

      if (filasConIndice.length > 1) {
        const ultimaIdx = filasConIndice.length - 1;

        // La fila más profunda también se fija con margen explícito, ANTES
        // de tocar cualquier otra — si no, sigue centrada con
        // "margin: 0 auto" y se corre sola más tarde cuando el gráfico
        // crece (al recalcular el ancho al final), desalineando todo lo
        // que ya se había puesto en relación a su posición original.
        {
          const rowEl = rowElPorFila[filasConIndice[ultimaIdx].i];
          const contRect0 = graphic.getBoundingClientRect();
          const rect = rowEl.getBoundingClientRect();
          rowEl.style.width = rect.width + 'px';
          rowEl.style.marginLeft = (rect.left - contRect0.left) + 'px';
          rowEl.style.marginRight = '0';
        }

        for (let idx = ultimaIdx - 1; idx >= 0; idx--) {
          posicionarFila(filasConIndice[idx].fila, filasConIndice[idx + 1].fila, rowElPorFila[filasConIndice[idx].i]);
        }
      }

      // Al reubicar filas a mano, alguna puede terminar más ancha que el
      // ancho "natural" que el navegador calculó antes (ej. una fila con
      // varias parejas que se van corriendo a la derecha para no pisarse).
      // El gráfico entero se re-mide según dónde quedó parado todo el
      // mundo de verdad, para que el achicado automático de más abajo y
      // las líneas SVG no corten ni midan mal el contenido.
      {
        const contRectPre = graphic.getBoundingClientRect();
        const nodos = Array.from(nodeById.values());
        const lefts = nodos.map((n) => n.getBoundingClientRect().left - contRectPre.left);
        const rights = nodos.map((n) => n.getBoundingClientRect().right - contRectPre.left);
        const minLeft = Math.min(0, ...lefts);
        const maxRight = Math.max(contRectPre.width, ...rights);
        // Si algo quedó a la izquierda del borde, corremos el gráfico ENTERO
        // (no cada nodo suelto) para no desalinear lo que ya está bien
        // alineado entre sí.
        graphic.style.marginLeft = (minLeft < 0 ? -minLeft : 0) + 'px';
        graphic.style.width = (maxRight - minLeft) + 'px';
      }

      const containerRect = graphic.getBoundingClientRect();
      svg.setAttribute('width', containerRect.width);
      svg.setAttribute('height', containerRect.height);
      svg.setAttribute('viewBox', `0 0 ${containerRect.width} ${containerRect.height}`);

      function centerOf(el) {
        const r = el.getBoundingClientRect();
        return {
          x: r.left + r.width / 2 - containerRect.left,
          y: r.top + r.height / 2 - containerRect.top,
          top: r.top - containerRect.top,
          bottom: r.bottom - containerRect.top,
        };
      }

      // Línea horizontal entre parejas (a la altura de las fotos), una sola
      // vez por pareja.
      const dibujadas = new Set();
      people.forEach((p) => {
        const partnerName = partnerOf.get(p.nombre);
        if (!partnerName) return;
        const key = [p.nombre, partnerName].sort().join('|');
        if (dibujadas.has(key)) return;
        const a = avatarByName.get(p.nombre);
        const b = avatarByName.get(partnerName);
        if (!a || !b) return;
        dibujadas.add(key);
        const ca = centerOf(a);
        const cb = centerOf(b);
        if (Math.abs(ca.y - cb.y) > 2) return; // solo si quedaron en la misma fila
        drawLine(svg, ca.x, ca.y, cb.x, cb.y);
      });

      // Línea de padre/madre real hacia cada hijo (campo "padres"), no por
      // generación genérica — así cada rama va a quien corresponde de verdad.
      // Cuando dos familias distintas quedan una al lado de la otra (ej. los
      // hermanos de un lado y la mamá del otro con muy pocos hijos), sus
      // líneas horizontales pueden terminar ocupando el mismo rango de
      // ancho y verse como una sola barra continua. Para evitarlo, cada
      // grupo de hermanos (mismos padres) que comparte la altura de la
      // transición usa un nivel Y un poco distinto ("escalonado").
      const nivelPorTransicion = new Map(); // "anchorY redondeado" -> Map(claveDePadres -> nivel)
      function nivelDeGrupo(anchorY, claveDePadres) {
        const t = Math.round(anchorY);
        if (!nivelPorTransicion.has(t)) nivelPorTransicion.set(t, new Map());
        const m = nivelPorTransicion.get(t);
        if (!m.has(claveDePadres)) m.set(claveDePadres, m.size);
        return m.get(claveDePadres);
      }

      people.forEach((p) => {
        // La propia posición de "p" siempre por ID — si hubiera otra
        // persona con el mismo nombre, no queremos robarle su avatar.
        const childAvatar = avatarById.get(p.id);
        if (!childAvatar) return;
        const padresNombres = (Array.isArray(p.padres) ? p.padres : [])
          .filter((n) => n !== p.nombre && avatarByName.has(n));
        if (!padresNombres.length) return;
        const childC = centerOf(childAvatar);
        const parentCenters = padresNombres.map((n) => centerOf(avatarByName.get(n)));
        // La línea tiene que arrancar DESPUÉS del nombre y el rol (todo el
        // .tree-node), no justo debajo del avatar — si no, pasa por encima
        // del texto en vez de por el espacio vacío entre filas.
        // Usamos el borde de la FILA (altura fija, igual para todos) y no
        // el del nodo individual — un nombre largo (ej. "Paula Franco")
        // puede ocupar dos líneas y quedar más alto que sus vecinos, lo que
        // corría la línea justo encima de ese texto.
        const parentRowBottoms = padresNombres.map((n) => centerOf(rowElDeNombre.get(n)).bottom);
        const anchorY = Math.max(...parentRowBottoms);
        if (anchorY >= childC.top) return; // evita líneas invertidas si el dato viene raro
        const anchorX = parentCenters.reduce((s, c) => s + c.x, 0) / parentCenters.length;

        const claveDePadres = padresNombres.slice().sort().join('|');
        const nivel = nivelDeGrupo(anchorY, claveDePadres);
        const disponible = childC.top - anchorY;
        const paso = Math.min(16, disponible / 5); // no pasarse del espacio real entre filas
        const midY = anchorY + paso * 1.2 + nivel * paso;

        drawLine(svg, anchorX, anchorY, anchorX, midY);
        drawLine(svg, anchorX, midY, childC.x, midY);
        drawLine(svg, childC.x, midY, childC.x, childC.top);
      });

      // El árbol suele ser más ancho que la pantalla (muchos tíos, sobrinos,
      // etc.) — en vez de depender de que se note que hay scroll horizontal,
      // lo achicamos para que entre completo. Si haría falta achicarlo
      // demasiado (letra ilegible), preferimos dejar el scroll.
      const disponibleAncho = wrap.clientWidth;
      const naturalAncho = graphic.scrollWidth;
      // 0.45 dejaba el nombre (14.4px) y el parentesco (12px) en ~6.5px/~5.4px
      // para familias grandes en el celular — bien por debajo de cualquier
      // piso legible. Con 0.75 el achicado sigue ayudando a que entre más
      // árbol sin scroll, pero el texto nunca baja de ~10.8px/9px — y si
      // igual no entra completo, ".wrap" ya tiene overflow-x:auto para que
      // se pueda desplazar en vez de forzar una letra ilegible.
      const MIN_ESCALA = 0.75;
      if (naturalAncho > disponibleAncho) {
        const escala = Math.max(MIN_ESCALA, disponibleAncho / naturalAncho);
        graphic.style.transform = `scale(${escala})`;
        graphic.style.transformOrigin = 'top left';
        wrap.style.height = (graphic.offsetHeight * escala) + 'px';
      } else {
        graphic.style.transform = '';
        wrap.style.height = '';
      }
    });
  }

  // Se actualiza cada vez que se carga el árbol — sirve de ayuda al editar
  // "padres" (para saber los nombres exactos disponibles para conectar).
  let nombresConocidos = [];

  // Corregir a mano el nombre, el parentesco, o de quién es hijo/a alguien
  // — para cuando la IA lo entendió mal (un nombre mal escrito, un
  // parentesco equivocado, o alguien que quedó conectado a la persona
  // equivocada, o sin conectar).
  async function editarPersona(id, nombreActual, relacionActual, padresActuales) {
    const nuevoNombre = prompt('Nombre:', nombreActual);
    if (nuevoNombre === null) return;
    const nuevaRelacion = prompt('Parentesco (con la persona principal):', relacionActual);
    if (nuevaRelacion === null) return;
    const otros = nombresConocidos.filter((n) => n !== nombreActual);
    const nuevosPadresRaw = prompt(
      `¿Hijo/a de quién? Escribe el nombre EXACTO del papá y/o la mamá, separados por coma (o déjalo vacío si no aplica).\n\nNombres disponibles: ${otros.join(', ')}`,
      (padresActuales || []).join(', ')
    );
    if (nuevosPadresRaw === null) return;
    const nombre = nuevoNombre.trim();
    const relacion = nuevaRelacion.trim();
    if (!nombre || !relacion) return;
    const padres = nuevosPadresRaw.split(',').map((s) => s.trim()).filter(Boolean).slice(0, 2);
    try {
      const resp = await fetch('/api/tree/person/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, relacion, padres }),
      });
      if (resp.ok) {
        cargar();
      } else {
        const data = await resp.json().catch(() => ({}));
        alert(data.error || 'No se pudo guardar el cambio.');
      }
    } catch (e) {
      alert('Hubo un problema para conectar.');
    }
  }

  let arbolVisto = false;

  async function cargar() {
    try {
      const resp = await fetch('/api/tree');
      if (resp.status === 401) {
        wrap.innerHTML = '<p class="msg">Inicia sesión en la bitácora primero. <a class="volver" href="/app.html">Ir a la bitácora</a></p>';
        return;
      }
      if (!resp.ok) throw new Error('fallo');
      const data = await resp.json();
      const people = (data.people || []).filter((p) => !esNovio(p.relacion));
      nombresConocidos = people.map((p) => p.nombre);
      renderTree(people);
      if (!arbolVisto) {
        arbolVisto = true;
        fetch('/api/tree/mark-seen', { method: 'POST' }).catch(() => {});
      }
    } catch (e) {
      wrap.innerHTML = '<p class="msg">No se pudo cargar el árbol. Intenta de nuevo más tarde.</p>';
    }
  }

  async function cargarColaboradores() {
    const colabSection = document.getElementById('colabSection');
    const colabGrid = document.getElementById('colabGrid');
    try {
      const resp = await fetch('/api/tree/colaboradores');
      if (!resp.ok) return;
      const data = await resp.json();
      const colaboradores = data.colaboradores || [];
      if (!colaboradores.length) return;
      colabGrid.innerHTML = '';
      colaboradores.forEach((c) => {
        const card = document.createElement('div');
        card.className = 'colab-card';
        const historiaTxt = c.historias === 1 ? '1 historia aportada' : `${c.historias} historias aportadas`;
        const avatarDiv = document.createElement('div');
        avatarDiv.className = 'avatar';
        avatarDiv.textContent = initials(c.nombre);
        card.appendChild(avatarDiv);
        const nombreStrong = document.createElement('strong');
        nombreStrong.textContent = c.nombre;
        card.appendChild(nombreStrong);
        if (c.parentesco) {
          const parentescoSpan = document.createElement('span');
          parentescoSpan.className = 'parentesco';
          parentescoSpan.textContent = c.parentesco;
          card.appendChild(parentescoSpan);
        }
        const historiasSpan = document.createElement('span');
        historiasSpan.className = 'historias';
        historiasSpan.textContent = historiaTxt;
        card.appendChild(historiasSpan);
        colabGrid.appendChild(card);
      });
      colabSection.style.display = 'block';
    } catch (e) {}
  }

  // Vuelve a repasar TODAS las charlas guardadas con las reglas más
  // recientes — útil cuando se corrige un bug de cómo se arma el árbol,
  // para que se aplique también a lo que ya se había armado antes.
  const rebuildBtn = document.getElementById('rebuildBtn');
  rebuildBtn.addEventListener('click', async () => {
    if (!confirm('Esto vuelve a armar el árbol repasando todas tus charlas de nuevo, con las reglas más recientes. Las correcciones manuales que hayas hecho a mano se pueden perder si esas charlas todavía sugieren otra cosa. ¿Continuar?')) return;
    rebuildBtn.disabled = true;
    rebuildBtn.textContent = 'Reconstruyendo…';
    try {
      const resp = await fetch('/api/rebuild-tree', { method: 'POST' });
      if (resp.ok) {
        cargar();
        cargarColaboradores();
      } else {
        const data = await resp.json().catch(() => ({}));
        alert(data.error || 'No se pudo reconstruir el árbol.');
      }
    } catch (e) {
      alert('Hubo un problema para conectar.');
    }
    rebuildBtn.disabled = false;
    rebuildBtn.textContent = '🔄 reconstruir árbol';
  });

  cargar();
  cargarColaboradores();
  window.addEventListener('resize', cargar);
})();
</script>
</body>
</html>
