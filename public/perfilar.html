<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Contarle a la IA — Los recuerdos de mis viejos</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/favicon-192.png">
<!-- Fuentes autoalojadas (ronda 2 del camino a CSP en enforce, 2026-09-06):
     antes venían de fonts.googleapis.com/fonts.gstatic.com, lo que además
     de la violación de CSP (font-src 'self') mandaba la IP de cada visita
     a un tercero. Ver public/fonts/fonts.css para el detalle. -->
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="/font-size.js"></script>
<style>
  :root {
    --bg: #F5EFE2;
    --ink: #2B241C;
    --ink-soft: #706551;
    --gold-deep: #8F5A20;
    --moss: #5B6B45;
    --font-display: "Source Serif 4", Georgia, serif;
    --font-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 3px solid var(--gold-deep); outline-offset: 2px; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding: calc(28px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }
  header { max-width: 560px; margin: 0 auto 20px; display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  h1 { font-family: var(--font-display); font-size: 1.4rem; margin: 0; }
  header p { color: var(--ink-soft); margin: 4px 0 0; font-size: 0.9rem; }
  a.volver { color: var(--gold-deep); font-size: 0.9rem; text-decoration: none; border-bottom: 1px solid var(--gold-deep); display: inline-flex; align-items: center; min-height: 44px; padding: 10px 4px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .empty { color: var(--ink-soft); font-style: italic; }
  .msg { font-size: 0.85rem; min-height: 1.1em; margin: 10px 0 0; color: var(--moss); }
  .msg.error { color: #a33; }

  .previo {
    background: #FBF6EA; border: 1px solid #E7DFCC; border-radius: 14px;
    padding: 14px 18px; margin-bottom: 20px; font-size: 0.88rem; color: var(--ink-soft);
  }
  .previo p { white-space: pre-wrap; margin: 8px 0 0; }
  .previo .btn.plain { padding: 8px 0; }

  .tarjeta {
    background: #FBF6EA; border: 1px solid #E7DFCC; border-radius: 16px;
    padding: 24px 22px; text-align: center;
  }
  .progreso { color: var(--ink-soft); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 10px; }
  .pregunta { font-family: var(--font-display); font-size: 1.25rem; line-height: 1.35; margin: 0 0 22px; }

  .orb {
    width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--gold-deep);
    background: var(--bg); color: var(--gold-deep); font-family: var(--font-body); font-weight: 700;
    font-size: 0.95rem; cursor: pointer; margin: 0 auto 14px; display: flex; align-items: center;
    justify-content: center; text-align: center; line-height: 1.25; padding: 8px;
  }
  .orb[data-state="recording"] { background: var(--gold-deep); color: #FBF6EA; border-color: var(--gold-deep); }
  .orb[data-state="processing"] { opacity: 0.6; cursor: default; }
  .estado { color: var(--ink-soft); font-size: 0.85rem; min-height: 1.2em; margin: 0 0 18px; }

  .respuesta-box { text-align: left; margin: 0 0 18px; }
  .respuesta-box label { display: block; font-size: 0.85rem; color: var(--ink-soft); margin: 0 0 6px; }
  .respuesta-box textarea {
    width: 100%; min-height: 90px; border: 1px solid #E7DFCC; border-radius: 10px; padding: 10px 12px;
    font-family: var(--font-body); font-size: 1rem; background: #fff; color: var(--ink); resize: vertical;
  }

  .nav-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;
    text-align: center; text-decoration: none; border: none; background: var(--moss);
    color: #FBF6EA; border-radius: 10px; padding: 10px 16px; font-weight: 700;
    cursor: pointer; font-family: var(--font-body); font-size: 0.9rem; min-height: 44px;
  }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn.plain { background: none; color: var(--gold-deep); text-decoration: underline; padding: 10px 4px; }
  .btn.saltar { background: none; color: var(--ink-soft); text-decoration: underline; }

  .listo-box { text-align: center; }
  .listo-box .check { font-size: 2.4rem; margin-bottom: 8px; }
</style>
</head>
<body>
  <header>
    <div>
      <h1 id="tituloPagina">Contarle a la IA</h1>
      <p id="subtitulo">Para que la converse ya conociéndola un poco.</p>
    </div>
    <a class="volver" href="/perfiles.html">← volver a perfiles</a>
  </header>
  <main class="wrap">
    <div class="previo" id="previoBox" hidden>
      <strong>Ya contamos esto antes:</strong>
      <p id="previoTexto"></p>
      <button class="btn plain" id="volverAGrabar" type="button">Volver a grabar desde el principio</button>
    </div>

    <div id="cargando" class="empty">Cargando…</div>

    <div class="tarjeta" id="flujo" hidden>
      <p class="progreso" id="progreso">Pregunta 1 de 4</p>
      <p class="pregunta" id="preguntaTexto"></p>
      <button class="orb" id="orb" type="button" data-state="idle">Presiona<br>para hablar</button>
      <p class="estado" id="estado">Toca para grabar tu respuesta</p>
      <div class="respuesta-box">
        <label for="respuestaTexto">Tu respuesta (puedes corregirla o escribirla directo)</label>
        <textarea id="respuestaTexto" placeholder="Aquí va a aparecer lo que digas — también puedes escribir directo."></textarea>
      </div>
      <div class="nav-row">
        <button class="btn plain" id="anteriorBtn" type="button">← Anterior</button>
        <button class="btn saltar" id="saltarBtn" type="button">Saltar esta</button>
        <button class="btn" id="siguienteBtn" type="button">Siguiente →</button>
      </div>
      <p class="msg" id="flujoMsg" role="status" aria-live="polite"></p>
    </div>

    <div class="tarjeta listo-box" id="listoBox" hidden>
      <div class="check">✓</div>
      <p><strong id="listoNombre"></strong> — listo, ya lo tenemos en cuenta.</p>
      <a class="btn" href="/perfiles.html">Volver a perfiles</a>
    </div>
  </main>

<script>
(function () {
  'use strict';

  // Item 15 (pedido de Felipe, 2026-09-08): 4 preguntas fijas, no una charla
  // dinámica con IA -- a propósito, para no tener que construir un segundo
  // motor de conversación (el de app.html/colaborar.html ya es bastante
  // delicado) solo para algo tan puntual como esto. Cada respuesta se puede
  // grabar por voz (se transcribe con /api/transcribe, el mismo que ya usa
  // el resto de la app) o escribir directo.
  const PREGUNTAS = [
    '¿Qué le gusta hacer o qué la hace feliz?',
    '¿Cómo es su personalidad? Por ejemplo, si es callada, conversadora, chistosa, seria...',
    '¿Hay algo de su vida o su historia que sea importante saber antes de empezar a conversar con ella?',
    '¿Algo más que quieras contarnos para conocerla mejor?',
  ];

  const params = new URLSearchParams(location.search);
  const id = parseInt(params.get('id'), 10);

  const cargando = document.getElementById('cargando');
  const flujo = document.getElementById('flujo');
  const listoBox = document.getElementById('listoBox');
  const previoBox = document.getElementById('previoBox');
  const previoTexto = document.getElementById('previoTexto');
  const volverAGrabar = document.getElementById('volverAGrabar');
  const tituloPagina = document.getElementById('tituloPagina');
  const subtitulo = document.getElementById('subtitulo');
  const progreso = document.getElementById('progreso');
  const preguntaTexto = document.getElementById('preguntaTexto');
  const orb = document.getElementById('orb');
  const estado = document.getElementById('estado');
  const respuestaTexto = document.getElementById('respuestaTexto');
  const anteriorBtn = document.getElementById('anteriorBtn');
  const siguienteBtn = document.getElementById('siguienteBtn');
  const saltarBtn = document.getElementById('saltarBtn');
  const flujoMsg = document.getElementById('flujoMsg');
  const listoNombre = document.getElementById('listoNombre');

  if (!id) {
    cargando.textContent = 'Falta indicar de quién se trata — vuelve a perfiles e intenta de nuevo.';
    document.body.querySelectorAll('main .tarjeta, .previo').forEach((el) => { el.hidden = true; });
  }

  let nombre = '';
  const respuestas = PREGUNTAS.map(() => '');
  let indice = 0;

  function mostrarPregunta() {
    progreso.textContent = `Pregunta ${indice + 1} de ${PREGUNTAS.length}`;
    preguntaTexto.textContent = PREGUNTAS[indice];
    respuestaTexto.value = respuestas[indice];
    anteriorBtn.disabled = indice === 0;
    siguienteBtn.textContent = indice === PREGUNTAS.length - 1 ? 'Guardar' : 'Siguiente →';
    orb.dataset.state = 'idle';
    orb.innerHTML = 'Presiona<br>para hablar';
    estado.textContent = 'Toca para grabar tu respuesta';
    flujoMsg.textContent = '';
  }

  async function cargar() {
    try {
      const resp = await fetch(`/api/subprofiles/${id}/onboarding`);
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        cargando.textContent = data.error || 'No se pudo cargar. Vuelve a perfiles e intenta de nuevo.';
        return;
      }
      nombre = data.nombre || 'esta persona';
      tituloPagina.textContent = `Contarle a la IA sobre ${nombre}`;
      subtitulo.textContent = `Unas preguntas cortas para que la app conozca un poco a ${nombre} antes de charlar.`;
      listoNombre.textContent = nombre;
      if (data.contextoOnboarding) {
        previoTexto.textContent = data.contextoOnboarding;
        previoBox.hidden = false;
      }
      cargando.hidden = true;
      flujo.hidden = false;
      mostrarPregunta();
    } catch (e) {
      cargando.textContent = 'No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.';
    }
  }

  volverAGrabar.addEventListener('click', () => {
    previoBox.hidden = true;
  });

  // --- Grabar por voz (push-to-talk simple: sin detección de silencio,
  // a propósito -- son 4 respuestas cortas y puntuales, no una charla
  // larga, así que no hace falta el mecanismo de VAD de app.html/
  // colaborar.html). ---
  let mediaStream = null;
  let mediaRecorder = null;
  let audioChunks = [];

  function mensajeErrorMicrofono(err) {
    const n = (err && err.name) || '';
    if (n === 'NotAllowedError' || n === 'PermissionDeniedError' || n === 'SecurityError') {
      return 'El micrófono está bloqueado para esta página — revisa el permiso en los Ajustes. Mientras tanto, puedes escribir la respuesta.';
    }
    if (n === 'NotFoundError' || n === 'DevicesNotFoundError') {
      return 'No se encontró un micrófono — puedes escribir la respuesta.';
    }
    if (n === 'NotReadableError' || n === 'TrackStartError') {
      return 'Otra app está usando el micrófono ahora mismo — puedes escribir la respuesta.';
    }
    return 'No se pudo acceder al micrófono — puedes escribir la respuesta.';
  }

  async function empezarGrabacion() {
    if (!window.MediaRecorder || !navigator.mediaDevices) {
      estado.textContent = 'Este navegador no puede grabar audio aquí — escribe tu respuesta abajo.';
      return;
    }
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      estado.textContent = mensajeErrorMicrofono(e);
      return;
    }
    audioChunks = [];
    try {
      mediaRecorder = new MediaRecorder(mediaStream, { audioBitsPerSecond: 40000 });
    } catch (e) {
      mediaRecorder = new MediaRecorder(mediaStream);
    }
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.start();
    orb.dataset.state = 'recording';
    orb.innerHTML = 'Grabando…<br>toca para terminar';
    estado.textContent = 'Habla cuando quieras — toca de nuevo para terminar';
  }

  function detenerGrabacion() {
    return new Promise((resolve) => {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') { resolve(null); return; }
      const mime = mediaRecorder.mimeType || 'audio/webm';
      mediaRecorder.onstop = () => resolve(new Blob(audioChunks, { type: mime }));
      mediaRecorder.stop();
      if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
    });
  }

  orb.addEventListener('click', async () => {
    if (orb.dataset.state === 'processing') return;
    if (orb.dataset.state === 'recording') {
      orb.dataset.state = 'processing';
      orb.innerHTML = 'Un momento…';
      estado.textContent = 'Transcribiendo…';
      const blob = await detenerGrabacion();
      if (!blob || !blob.size) {
        orb.dataset.state = 'idle';
        orb.innerHTML = 'Presiona<br>para hablar';
        estado.textContent = 'No se grabó nada — intenta de nuevo, o escribe tu respuesta.';
        return;
      }
      try {
        const resp = await fetch('/api/transcribe', { method: 'POST', headers: { 'Content-Type': blob.type || 'audio/webm' }, body: blob });
        const data = await resp.json().catch(() => ({}));
        if (resp.ok && data.text) {
          respuestaTexto.value = (respuestaTexto.value ? respuestaTexto.value + ' ' : '') + data.text;
          estado.textContent = 'Listo — revisa la respuesta abajo, o graba de nuevo.';
        } else {
          estado.textContent = data.error || 'No se pudo transcribir — escribe tu respuesta abajo.';
        }
      } catch (e) {
        estado.textContent = 'No se pudo conectar para transcribir — escribe tu respuesta abajo.';
      }
      orb.dataset.state = 'idle';
      orb.innerHTML = 'Presiona<br>para hablar';
      return;
    }
    empezarGrabacion();
  });

  function guardarRespuestaActual() {
    respuestas[indice] = respuestaTexto.value.trim();
  }

  anteriorBtn.addEventListener('click', () => {
    guardarRespuestaActual();
    if (indice === 0) return;
    indice--;
    mostrarPregunta();
  });

  saltarBtn.addEventListener('click', () => {
    respuestas[indice] = '';
    respuestaTexto.value = '';
    avanzarOGuardar();
  });

  siguienteBtn.addEventListener('click', () => {
    guardarRespuestaActual();
    avanzarOGuardar();
  });

  async function avanzarOGuardar() {
    if (indice < PREGUNTAS.length - 1) {
      indice++;
      mostrarPregunta();
      return;
    }
    // Última pregunta -> guardar todo.
    siguienteBtn.disabled = true;
    flujoMsg.textContent = '';
    const cuerpo = { respuestas: PREGUNTAS.map((p, i) => ({ pregunta: p, respuesta: respuestas[i] })) };
    try {
      const resp = await fetch(`/api/subprofiles/${id}/onboarding`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        flujoMsg.textContent = data.error || 'No se pudo guardar. Intenta de nuevo.';
        flujoMsg.classList.add('error');
        siguienteBtn.disabled = false;
        return;
      }
      flujo.hidden = true;
      previoBox.hidden = true;
      listoBox.hidden = false;
    } catch (e) {
      flujoMsg.textContent = 'No se pudo conectar. Intenta de nuevo.';
      flujoMsg.classList.add('error');
      siguienteBtn.disabled = false;
    }
  }

  if (id) cargar();
})();
</script>
</body>
</html>
